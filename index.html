/* ── QUANTITY CALCULATORS ────────────────────────────────────────────────── */
const CALCS=[
  {
    id:"wall",label:"Wall Blocks",title:"Blocks needed for a wall",sub:"Calculate how many 9\" hollow blocks you need for any wall",
    fields:[
      {id:"wlen",label:"Wall Length (m)",def:"5",type:"number"},
      {id:"wht",label:"Wall Height (m)",def:"3",type:"number"},
      {id:"wdoors",label:"Number of Doors",def:"1",type:"number"},
      {id:"wwin",label:"Number of Windows",def:"2",type:"number"},
    ],
    calc(v){
      const len=parseFloat(v.wlen)||0,ht=parseFloat(v.wht)||0;
      const doors=parseInt(v.wdoors)||0,wins=parseInt(v.wwin)||0;
      const gross=len*ht;
      const openings=doors*(2.1*0.9)+wins*(1.2*1.2);
      const net=Math.max(gross-openings,0);
      const blocks=Math.ceil(net*12*1.08);
      const cement=Math.ceil(blocks/80);
      const sand=+(blocks*0.006).toFixed(1);
      return [
        {l:"Wall area (gross)",v:gross.toFixed(1)+" m\u00b2",hero:false},
        {l:"Opening deductions",v:openings.toFixed(1)+" m\u00b2",hero:false},
        {l:"Net wall area",v:net.toFixed(1)+" m\u00b2",hero:false},
        {l:"Blocks needed (inc. 8% waste)",v:blocks.toLocaleString(),hero:true},
        {l:"Cement bags for mortar",v:cement+" bags",hero:false},
        {l:"Sand for mortar",v:sand+" tons",hero:false},
      ];
    },
    formula:"Based on 12 blocks per m\u00b2 for 9\" hollow blocks, with 8% cutting waste, 1 bag cement per 80 blocks, and standard door (2.1\u00d70.9m) and window (1.2\u00d71.2m) deductions."
  },
  {
    id:"slab",label:"Concrete Slab",title:"Concrete for a floor slab",sub:"Cement, sand and aggregate for a 100mm (4\") concrete slab",
    fields:[
      {id:"slen",label:"Length (m)",def:"8",type:"number"},
      {id:"swid",label:"Width (m)",def:"6",type:"number"},
      {id:"sthick",label:"Thickness (mm)",def:"100",type:"number"},
    ],
    calc(v){
      const l=parseFloat(v.slen)||0,w=parseFloat(v.swid)||0,t=(parseFloat(v.sthick)||100)/1000;
      const vol=l*w*t;
      const cement=Math.ceil(vol*7*1.05);
      const sand=+(vol*0.45*1.6*1.1).toFixed(1);
      const gravel=+(vol*0.9*1.8*1.1).toFixed(1);
      const rebar=Math.ceil(l*w*1.2);
      return [
        {l:"Slab volume",v:vol.toFixed(2)+" m\u00b3",hero:false},
        {l:"Cement bags (1:2:4 mix)",v:cement+" bags",hero:true},
        {l:"Sharp sand",v:sand+" tons",hero:false},
        {l:"Gravel / aggregate",v:gravel+" tons",hero:false},
        {l:"Y12 rebar bars",v:rebar+" bars",hero:false},
      ];
    },
    formula:"Based on a 1:2:4 mix ratio. 7 bags of cement per m\u00b3, with 5% waste. Sand and aggregate quantities include 10% waste allowance. Rebar based on 1.2 bars per m\u00b2."
  },
  {
    id:"roof",label:"Roof Sheets",title:"Roofing sheets for a pitched roof",sub:"How many corrugated iron sheets you need",
    fields:[
      {id:"rlen",label:"Building Length (m)",def:"10",type:"number"},
      {id:"rwid",label:"Building Width (m)",def:"8",type:"number"},
      {id:"rpitch",label:"Roof Pitch",def:"25",type:"select",opts:[["15","15\u00b0 (low)"],["25","25\u00b0 (standard)"],["35","35\u00b0 (steep)"],["45","45\u00b0 (very steep)"]]},
      {id:"rsheet",label:"Sheet Length",def:"3",type:"select",opts:[["3","3m sheets"],["6","6m sheets"]]},
    ],
    calc(v){
      const l=parseFloat(v.rlen)||0,w=parseFloat(v.rwid)||0;
      const pitch=parseFloat(v.rpitch)||25;
      const sheetLen=parseFloat(v.rsheet)||3;
      const pitchFactor={15:1.04,25:1.10,35:1.22,45:1.41}[pitch]||1.10;
      const roofArea=l*(w/2)*pitchFactor*2; // both sides
      const usableW=0.76; // effective cover width with overlap
      const sheetsWide=Math.ceil((w/2)*pitchFactor/sheetLen)+1;
      const sheetsLong=Math.ceil(l/usableW);
      const total=Math.ceil(sheetsWide*sheetsLong*2*1.05);
      const ridgeCaps=Math.ceil(l/3)+1;
      const nails=Math.ceil(total*0.25);
      const battens=Math.ceil(roofArea*0.8);
      return [
        {l:"Roof area (both sides)",v:roofArea.toFixed(1)+" m\u00b2",hero:false},
        {l:sheetLen+"m sheets needed (inc. waste)",v:total+" sheets",hero:true},
        {l:"Ridge caps (3m)",v:ridgeCaps+" pieces",hero:false},
        {l:'Roofing nails 3" (kg)',v:nails+" kg",hero:false},
        {l:"Timber battens (pieces)",v:battens+" pieces",hero:false},
      ];
    },
    formula:"Based on 0.76m effective cover width per sheet with standard 70mm side overlap. Pitch factor applied to both roof slopes. 5% waste included."
  },
  {
    id:"paint",label:"Paint Coverage",title:"Paint needed for walls & ceiling",sub:"How many buckets of emulsion to cover your rooms",
    fields:[
      {id:"prooms",label:"Number of Rooms",def:"4",type:"number"},
      {id:"plen",label:"Avg Room Length (m)",def:"4",type:"number"},
      {id:"pwid",label:"Avg Room Width (m)",def:"3.5",type:"number"},
      {id:"pht",label:"Ceiling Height (m)",def:"2.8",type:"number"},
      {id:"pcoats",label:"Number of Coats",def:"2",type:"select",opts:[["1","1 coat"],["2","2 coats"],["3","3 coats"]]},
    ],
    calc(v){
      const rooms=parseInt(v.prooms)||1,l=parseFloat(v.plen)||4,w=parseFloat(v.pwid)||3.5,ht=parseFloat(v.pht)||2.8,coats=parseInt(v.pcoats)||2;
      const wallArea=rooms*2*(l+w)*ht*0.85; // 15% deduction for doors/windows
      const ceilArea=rooms*l*w;
      const total=(wallArea+ceilArea)*coats;
      const buckets20L=Math.ceil(total/80); // emulsion ~8m²/L → 160m² per 20L but walls absorb more, use 80m²
      const undercoat=Math.ceil(rooms/2);
      return [
        {l:"Total wall area",v:wallArea.toFixed(0)+" m\u00b2",hero:false},
        {l:"Total ceiling area",v:ceilArea.toFixed(0)+" m\u00b2",hero:false},
        {l:"Total area to paint",v:total.toFixed(0)+" m\u00b2",hero:false},
        {l:"Emulsion 20L buckets",v:buckets20L+" buckets",hero:true},
        {l:"Undercoat (4L tins)",v:undercoat+" tins",hero:false},
      ];
    },
    formula:"Based on 80m\u00b2 coverage per 20L bucket on plastered surfaces. 15% deduction for door and window openings. Add 10% extra for rough or porous walls."
  },
];

function QuantityCalcs({currency}){
  const{add}=useCart();
  const[activeCalc,setActiveCalc]=useState(CALCS[0].id);
  const calc=CALCS.find(c=>c.id===activeCalc)||CALCS[0];
  const initVals=Object.fromEntries(calc.fields.map(f=>[f.id,f.def]));
  const[vals,setVals]=useState(initVals);

  // Reset values when switching calc
  function switchCalc(id){
    setActiveCalc(id);
    const nc=CALCS.find(c=>c.id===id);
    if(nc)setVals(Object.fromEntries(nc.fields.map(f=>[f.id,f.def])));
  }

  const results=useMemo(()=>{
    try{return calc.calc(vals);}catch{return [];}
  },[calc,vals]);

  return h('section',{id:"calculators",className:"sec calc-sec"},
    h('div',{className:"wrap"},
      h('div',{className:"sec-eyebrow"},"Material Calculators"),
      h('h2',{className:"sec-title"},"Calculate exact quantities."),
      h('p',{className:"sec-sub"},
        "Stop guessing how much material you need. Enter your dimensions and get instant, accurate quantities for blocks, concrete, roofing, and paint."
      ),
      h('div',{className:"calc-tabs",role:"tablist"},
        ...CALCS.map(c=>h('button',{
          key:c.id,className:"calc-tab"+(activeCalc===c.id?" on":""),
          onClick:()=>switchCalc(c.id),role:"tab","aria-selected":activeCalc===c.id,
        },c.label))
      ),
      h('div',{className:"calc-card"},
        h('div',{className:"calc-card-hdr"},
          h('div',{className:"calc-card-title"},calc.title),
          h('div',{className:"calc-card-sub"},calc.sub)
        ),
        h('div',{className:"calc-body"},
          h('div',{className:"calc-inputs"},
            ...calc.fields.map(f=>h('div',{key:f.id,className:"calc-field"},
              h('label',{htmlFor:"calc-"+f.id},f.label),
              f.type==="select"
                ? h('select',{
                    id:"calc-"+f.id,
                    value:vals[f.id]||f.def,
                    onChange:e=>setVals(p=>({...p,[f.id]:e.target.value})),
                  },
                    ...(f.opts||[]).map(([v,l])=>h('option',{key:v,value:v},l))
                  )
                : h('input',{
                    id:"calc-"+f.id,
                    type:"number",min:"0",step:"0.5",
                    value:vals[f.id]||"",
                    onChange:e=>setVals(p=>({...p,[f.id]:e.target.value})),
                  })
            ))
          ),
          results.length>0&&h('div',{className:"calc-results"},
            ...results.map(r=>h('div',{key:r.l,className:"calc-result-row"},
              h('span',{className:"calc-result-lbl"},r.l),
              h('span',{className:"calc-result-val"+(r.hero?" hero":"")},r.v)
            ))
          ),
          h('p',{className:"calc-formula"},calc.formula)
        )
      )
    )
  );
}

/* ── SHARE QUOTE (WhatsApp) + PRINT ──────────────────────────────────────── */
function ShareAndPrint({items,currency}){
  const total=items.reduce((s,i)=>s+i.gmd*(i.qty||1),0);

  function buildMessage(){
    const lines=items.map(i=>`• ${i.name} × ${i.qty} ${i.unit} = ${fmt(i.gmd*i.qty,currency)}`).join('\n');
    return encodeURIComponent(
      `Hi Briksafe 👋\n\nI'd like a quote for the following materials:\n\n${lines}\n\nEstimated total: ${fmt(total,currency)}\n\nCould you please confirm pricing and availability? Thank you.`
    );
  }

  function printQuote(){
    window.print();
  }

  if(!items.length)return null;

  return h('div',{style:{display:"flex",gap:"10px",flexWrap:"wrap",marginTop:"var(--sp-4)"}},
    h('a',{
      href:"https://wa.me/2203569784?text="+buildMessage(),
      target:"_blank",rel:"noopener noreferrer",
      className:"wa-btn",
      style:{fontSize:"var(--t-xs)",padding:"10px 16px",minHeight:"40px"},
      "aria-label":"Share quote on WhatsApp",
    },
      h(IWp),
      "Share via WhatsApp"
    ),
    h('button',{
      onClick:printQuote,
      style:{
        height:"40px",padding:"0 16px",
        background:"#fff",color:"var(--ink-700)",
        border:"1.5px solid var(--ink-200)",borderRadius:"var(--r)",

      onMouseOut:e=>{e.currentTarget.style.borderColor="var(--ink-200)"},
    },
      h('svg',{width:14,height:14,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"},

  return h('div',{className:"mob-sticky","aria-label":"Quick actions"},
    h('button',{
      className:"mob-sticky-quote",
      onClick:()=>setCartOpen(true),
      "aria-label":"Open quote builder",

      h(ICart),
      count>0 ? "View Quote ("+count+")" : "Build Your Quote"
    ),
    h('a',{
      className:"mob-sticky-wa",
      href:"https://wa.me/2203569784",
      target:"_blank",rel:"noopener noreferrer",
      "aria-label":"WhatsApp Briksafe",
    },h(IWp))
  );

/* ── APP ───────────────────────────────────────────────────────────────── */
function App(){
  const[cartOpen,setCartOpen]=useState(false);
  const[currency,setCurrency]=useState(()=>localStorage.getItem('briksafe_currency')||'GMD');
  return h(CartProvider,null,
    h(AppInner,{cartOpen,setCartOpen,currency,setCurrency})
  );
}

// Inner app so we can access cart context for project loading
function AppInner({cartOpen,setCartOpen,currency,setCurrency}){
  const{add,clear}=useCart();

  const{items}=useCart();
  const total=items.reduce((s,i)=>s+i.gmd*(i.qty||1),0);

  // Listen for project load events from SavedProjects component
  useEffect(()=>{
    function handler(e){
      clear();
      setTimeout(()=>{
        e.detail.forEach(item=>add(item));
        setCartOpen(true);
      },100);
    }
    window.addEventListener('briksafe:loadproject',handler);
    return()=>window.removeEventListener('briksafe:loadproject',handler);
  },[add,clear,setCartOpen]);

  return h(Fragment,null,
    h(Header,{setCartOpen}),
    h(PriceBanner),
    h('main',null,
      h(Hero),
      h(Materials,{currency,setCurrency:c=>{setCurrency(c);localStorage.setItem('briksafe_currency',c);}}),

      h(TrustHow),
      h(ToolsHub,{currency}),
      h(FaqSection),
      h(SavedProjects,{currency}),
      h(QuoteForm,{currency})
    ),
    h(Footer),
    h(CartSidebar,{open:cartOpen,onClose:()=>setCartOpen(false),currency}),
    // Print-only quote — invisible on screen, shown only when printing
    h('div',{className:"print-quote","aria-hidden":"true"},
      h('div',{className:"pq-header"},
        h('div',{className:"pq-brand"},"Briksafe — Quote Request"),
        h('div',{className:"pq-meta"},"Prepared: "+new Date().toLocaleDateString('en-GB')+" \u00b7 briksafe.com \u00b7 WhatsApp: +220 356 9784")
      ),
      items.length===0
        ? h('p',null,"No items in quote.")
        : [
            h('table',{key:"t",className:"pq-table"},
              h('thead',null,h('tr',null,
                ...["Material","Unit","Qty","Price / Unit","Line Total"].map(c=>h('th',{key:c},c))
              )),
              h('tbody',null,
                ...items.map(it=>h('tr',{key:it.id},
                  h('td',null,it.name),
                  h('td',null,it.unit),
                  h('td',null,it.qty),
                  h('td',null,fmt(it.gmd,currency)),
                  h('td',null,fmt(it.gmd*it.qty,currency))
                ))
              )
            ),
            h('div',{key:"tot",className:"pq-total"},"Total ("+currency+"): "+fmt(total,currency)),
            h('div',{key:"foot",className:"pq-footer"},
              "Prices are market estimates only. Final pricing confirmed by Briksafe before any payment is requested. \u00a9 "+new Date().getFullYear()+" Briksafe."
            )
          ]
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
