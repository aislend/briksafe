<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Briksafe — Build Your Home in The Gambia, Without the Stress</title>
<link rel="icon" href="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231a4731'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle'%3E%F0%9F%A7%B1%3C/text%3E%3C/svg%3E"/>
<meta name="description" content="Briksafe is your trusted construction partner in The Gambia. We buy materials, hire contractors, supervise your build, and send you photo proof — so you never get cheated building from abroad."/>
<meta property="og:title" content="Briksafe — Build Your Home in The Gambia, Without the Stress"/>
<meta property="og:description" content="Tell us what you want to build. We handle everything on the ground — materials, contractors, supervision, and photo updates throughout."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://briksafe.com"/>
<link rel="canonical" href="https://briksafe.com"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg-warm:#f7f5f0;--bg-cool:#f4f7f9;--bg-sage:#eef4f0;
  --ink-900:#0d1c14;--ink-700:#2d4035;--ink-600:#445c4a;--ink-500:#6b7f71;
  --ink-400:#96a89b;--ink-300:#c2cec6;--ink-200:#dde5df;--ink-100:#eef2ef;
  --forest:#1a4731;--forest-mid:#256040;--forest-lt:#3d8c5e;
  --gold:#c8943a;--gold-pale:#fdf3e0;--gold-border:#f0d090;
  --red:#b91c1c;--red-pale:#fef2f2;
  --ff:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --t-xs:.6875rem;--t-sm:.8125rem;--t-base:.9375rem;--t-md:1.0625rem;
  --t-lg:1.1875rem;--t-xl:1.4375rem;--t-2xl:1.875rem;--t-3xl:2.375rem;
  --t-hero:clamp(2.1rem,5.5vw,3.75rem);
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;
  --sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;--sp-16:64px;--sp-20:80px;
  --r-sm:4px;--r:6px;--r-md:10px;--r-lg:16px;--r-xl:24px;
  --bdr:1px solid var(--ink-200);--bdr-sage:1px solid #c8ddd0;
  --sh-xs:0 1px 3px rgba(13,28,20,.06);
  --sh-sm:0 2px 8px rgba(13,28,20,.08),0 1px 3px rgba(13,28,20,.05);
  --sh:0 4px 20px rgba(13,28,20,.09),0 2px 6px rgba(13,28,20,.05);
  --sh-lg:0 8px 40px rgba(13,28,20,.11),0 3px 10px rgba(13,28,20,.06);
  --sh-xl:0 20px 64px rgba(13,28,20,.13),0 4px 16px rgba(13,28,20,.07);
  --max:1200px;--gutter:clamp(16px,4vw,40px);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--ff);font-size:var(--t-base);line-height:1.65;color:var(--ink-700);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--ff);font-weight:700;color:var(--ink-900);line-height:1.2;letter-spacing:-.02em}
p{color:var(--ink-600);line-height:1.75}
button{cursor:pointer;border:none;background:none;font-family:var(--ff)}
input,select,textarea{font-family:var(--ff)}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--ink-300);border-radius:3px}

/* LAYOUT */
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
.sec{padding:var(--sp-16) 0}
@media(min-width:768px){.sec{padding:var(--sp-20) 0}}

/* EYEBROW */
.eyebrow{font-size:var(--t-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--forest-lt);margin-bottom:var(--sp-3);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:'';width:18px;height:1.5px;background:var(--forest-lt);border-radius:1px;flex-shrink:0}
.sec-title{font-size:clamp(1.6rem,3.5vw,var(--t-3xl));font-weight:800;color:var(--ink-900);letter-spacing:-.03em;margin-bottom:var(--sp-3);line-height:1.15}
.sec-sub{font-size:var(--t-md);color:var(--ink-500);max-width:560px;line-height:1.8;font-weight:300}

/* BUTTONS */
.btn-primary{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-base);font-weight:700;background:var(--forest);color:#fff;padding:14px 28px;border-radius:var(--r);border:none;cursor:pointer;transition:all .2s;letter-spacing:.01em;min-height:52px;box-shadow:0 2px 12px rgba(26,71,49,.25)}
.btn-primary:hover{background:var(--forest-mid);transform:translateY(-1px);box-shadow:0 4px 20px rgba(26,71,49,.3)}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-base);font-weight:600;background:transparent;color:var(--ink-700);padding:13px 28px;border-radius:var(--r);border:1.5px solid var(--ink-200);cursor:pointer;transition:all .2s;min-height:52px}
.btn-secondary:hover{border-color:var(--ink-400);color:var(--ink-900);background:var(--bg-warm)}
.btn-ghost-white{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-sm);font-weight:600;background:transparent;color:rgba(255,255,255,.8);padding:11px 22px;border-radius:var(--r);border:1px solid rgba(255,255,255,.25);cursor:pointer;transition:all .2s;min-height:44px}
.btn-ghost-white:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.wa-btn{display:inline-flex;align-items:center;gap:8px;background:#25d366;color:#fff;font-size:var(--t-sm);font-weight:700;padding:12px 22px;border-radius:var(--r);text-decoration:none;transition:all .2s;min-height:48px}
.wa-btn:hover{background:#1ebe5d;transform:translateY(-1px)}

/* ── HEADER ──────────────────────────────────────────────────────────────── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;height:62px;background:rgba(255,255,255,.97);border-bottom:var(--bdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hdr-in{max-width:var(--max);margin:0 auto;padding:0 var(--gutter);height:100%;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4)}
.logo{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer}
.logo-mark{width:32px;height:32px;background:var(--forest);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.logo-text{font-size:1.05rem;font-weight:800;color:var(--ink-900);letter-spacing:-.03em}
.logo-sub{font-size:.6rem;font-weight:600;color:var(--ink-400);letter-spacing:.06em;text-transform:uppercase;display:block;line-height:1;margin-top:1px}
.nav{display:none}
@media(min-width:860px){
  .nav{display:flex;align-items:center;gap:2px}
  .nl{font-size:var(--t-sm);font-weight:500;color:var(--ink-500);padding:7px 13px;border-radius:var(--r-sm);transition:all .15s;background:none;border:none;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
  .nl:hover{color:var(--ink-900);background:var(--ink-100)}
}
.hdr-cta{display:flex;align-items:center;gap:var(--sp-2)}
.start-btn{font-size:var(--t-sm);font-weight:700;background:var(--forest);color:#fff;padding:9px 20px;border-radius:var(--r);border:none;cursor:pointer;transition:all .15s;white-space:nowrap;min-height:40px}
.start-btn:hover{background:var(--forest-mid)}
.hbg{display:flex;color:var(--ink-700);padding:8px;min-height:44px;min-width:44px;align-items:center;justify-content:center;border-radius:var(--r-sm);cursor:pointer}
@media(min-width:860px){.hbg{display:none}}
.mob-nav{position:fixed;top:62px;left:0;right:0;background:#fff;border-bottom:var(--bdr);padding:var(--sp-3);z-index:199;box-shadow:var(--sh-lg);display:flex;flex-direction:column;gap:2px}
.mob-nl{display:block;font-size:var(--t-base);font-weight:500;color:var(--ink-600);padding:12px 14px;border-radius:var(--r);min-height:44px;transition:background .15s;cursor:pointer;background:none;border:none;text-align:left;text-decoration:none;width:100%}
.mob-nl:hover{background:var(--bg-warm);color:var(--ink-900)}

/* ── HERO ────────────────────────────────────────────────────────────────── */
.hero{padding:calc(62px + clamp(48px,7vw,88px)) var(--gutter) clamp(48px,7vw,80px);background:var(--forest);position:relative;overflow:hidden;min-height:92vh;display:flex;align-items:center}
.hero-bg-pattern{position:absolute;inset:0;opacity:.035;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero-bg-glow{position:absolute;bottom:-120px;right:-80px;width:520px;height:520px;background:radial-gradient(circle,rgba(255,255,255,.06) 0%,transparent 65%);pointer-events:none}
.hero-in{max-width:var(--max);margin:0 auto;width:100%;display:grid;grid-template-columns:1fr;gap:var(--sp-12)}
@media(min-width:960px){.hero-in{grid-template-columns:1fr 420px;align-items:center;gap:var(--sp-16)}}
.hero-eyebrow{font-size:var(--t-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:var(--sp-5);display:flex;align-items:center;gap:8px}
.hero-eyebrow::before{content:'';width:20px;height:1.5px;background:rgba(255,255,255,.4);flex-shrink:0}
.hero h1{font-size:var(--t-hero);font-weight:800;color:#fff;letter-spacing:-.035em;line-height:1.08;margin-bottom:var(--sp-5)}
.hero h1 em{font-style:normal;color:rgba(255,255,255,.55)}
.hero-sub{font-size:var(--t-md);color:rgba(255,255,255,.6);line-height:1.8;max-width:520px;margin-bottom:var(--sp-8);font-weight:300}
.hero-sub strong{color:rgba(255,255,255,.9);font-weight:600}
.hero-actions{display:flex;gap:var(--sp-3);flex-wrap:wrap}
.btn-hero-primary{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-base);font-weight:800;background:#fff;color:var(--forest);padding:15px 32px;border-radius:var(--r);border:none;cursor:pointer;transition:all .2s;min-height:56px;box-shadow:0 4px 20px rgba(0,0,0,.15);letter-spacing:-.01em}
.btn-hero-primary:hover{background:var(--bg-warm);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.2)}
.hero-reassurance{display:flex;flex-direction:column;gap:var(--sp-2);margin-top:var(--sp-8);padding-top:var(--sp-6);border-top:1px solid rgba(255,255,255,.1)}
.reassurance-item{display:flex;align-items:center;gap:10px;font-size:var(--t-sm);color:rgba(255,255,255,.65)}
.reassurance-check{width:18px;height:18px;background:rgba(255,255,255,.12);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.6rem;color:rgba(255,255,255,.9)}

/* HERO CARD */
.hero-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-xl);overflow:hidden;backdrop-filter:blur(20px)}
.hc-header{background:rgba(255,255,255,.08);padding:var(--sp-4) var(--sp-5);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.hc-title{font-size:var(--t-sm);font-weight:700;color:rgba(255,255,255,.8)}
.hc-badge{font-size:var(--t-xs);font-weight:700;color:#fff;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:100px;border:1px solid rgba(255,255,255,.2)}
.hc-service{padding:var(--sp-4) var(--sp-5);border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:var(--sp-4)}
.hc-service:last-of-type{border-bottom:none}
.hc-service-icon{font-size:1.4rem;flex-shrink:0}
.hc-service-name{font-size:var(--t-sm);font-weight:600;color:#fff}
.hc-service-desc{font-size:var(--t-xs);color:rgba(255,255,255,.5);margin-top:2px}
.hc-service-arrow{margin-left:auto;color:rgba(255,255,255,.3);font-size:.85rem}
.hc-footer{padding:var(--sp-4) var(--sp-5);background:rgba(255,255,255,.04)}
.hc-stat{display:flex;align-items:center;gap:var(--sp-3);font-size:var(--t-xs);color:rgba(255,255,255,.5);margin-bottom:6px}
.hc-stat:last-child{margin-bottom:0}
.hc-stat-dot{width:6px;height:6px;background:rgba(255,255,255,.3);border-radius:50%;flex-shrink:0}
@media(max-width:959px){.hero-card{display:none}}

/* ── TRUST BAR ───────────────────────────────────────────────────────────── */
.trust-bar{background:var(--bg-warm);border-bottom:var(--bdr);padding:var(--sp-4) 0;overflow:hidden}
.trust-bar-inner{max-width:var(--max);margin:0 auto;padding:0 var(--gutter);display:flex;align-items:center;gap:clamp(var(--sp-6),4vw,var(--sp-12));flex-wrap:wrap;justify-content:center}
.tb-item{display:flex;align-items:center;gap:8px;font-size:var(--t-xs);font-weight:600;color:var(--ink-600);white-space:nowrap}
.tb-icon{font-size:.85rem}
.tb-sep{color:var(--ink-300);font-size:.7rem}
@media(max-width:600px){.tb-sep{display:none}}

/* ── SERVICES ────────────────────────────────────────────────────────────── */
.services-sec{background:var(--bg)}
.services-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-4);margin-top:var(--sp-10)}
@media(min-width:480px){.services-grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.services-grid{grid-template-columns:repeat(3,1fr)}}
.service-card{background:#fff;border:var(--bdr);border-radius:var(--r-lg);padding:var(--sp-6);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.service-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--forest);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.service-card:hover{border-color:var(--forest);box-shadow:var(--sh);transform:translateY(-2px)}
.service-card:hover::before{transform:scaleX(1)}
.service-icon{font-size:2.2rem;margin-bottom:var(--sp-4);display:block}
.service-name{font-size:var(--t-lg);font-weight:800;color:var(--ink-900);letter-spacing:-.02em;margin-bottom:6px}
.service-desc{font-size:var(--t-sm);color:var(--ink-500);line-height:1.65;margin-bottom:var(--sp-4)}
.service-range{display:flex;align-items:center;gap:6px;font-size:var(--t-xs)}
.service-range-label{color:var(--ink-400);font-weight:500}
.service-range-val{font-weight:700;color:var(--forest);font-size:var(--t-sm)}
.service-cta{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-xs);font-weight:700;color:var(--forest);margin-top:var(--sp-4)}

/* ── HOW IT WORKS ────────────────────────────────────────────────────────── */
.how-sec{background:var(--bg-warm);border-top:var(--bdr);border-bottom:var(--bdr)}
.how-steps{display:grid;grid-template-columns:1fr;gap:0;margin-top:var(--sp-10)}
@media(min-width:700px){.how-steps{grid-template-columns:repeat(5,1fr);gap:0;position:relative}}
.how-steps::after{content:'';position:absolute;top:36px;left:10%;right:10%;height:2px;background:linear-gradient(90deg,var(--ink-200),var(--forest-lt),var(--ink-200));z-index:0}
@media(max-width:699px){.how-steps::after{display:none}}
.how-step{text-align:center;position:relative;z-index:1;padding:var(--sp-5) var(--sp-4);background:var(--bg-warm)}
@media(max-width:699px){.how-step{display:flex;gap:var(--sp-4);text-align:left;align-items:flex-start;padding:var(--sp-4) 0;border-bottom:var(--bdr)}.how-step:last-child{border-bottom:none}}
.how-step-num{width:72px;height:72px;border-radius:50%;background:#fff;border:2.5px solid var(--ink-200);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-4);font-size:var(--t-xl);font-weight:800;color:var(--ink-400);letter-spacing:-.02em;box-shadow:0 0 0 6px var(--bg-warm);position:relative;z-index:1;flex-shrink:0}
.how-step-num.active{background:var(--forest);border-color:var(--forest);color:#fff;box-shadow:0 0 0 6px var(--bg-warm),0 4px 20px rgba(26,71,49,.2)}
@media(max-width:699px){.how-step-num{width:44px;height:44px;font-size:var(--t-base);margin:0}}
.how-step h3{font-size:var(--t-sm);font-weight:700;color:var(--ink-900);margin-bottom:6px;letter-spacing:-.01em}
.how-step p{font-size:var(--t-xs);color:var(--ink-500);line-height:1.65}

/* ── PROMISE SECTION ─────────────────────────────────────────────────────── */
.promise-sec{background:var(--bg)}
.promise-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-12);margin-top:var(--sp-10)}
@media(min-width:900px){.promise-grid{grid-template-columns:1fr 1fr;align-items:start;gap:var(--sp-16)}}
.promise-list{display:flex;flex-direction:column;gap:0}
.promise-item{display:flex;gap:var(--sp-4);align-items:flex-start;padding:var(--sp-5) 0;border-bottom:var(--bdr)}
.promise-item:last-child{border-bottom:none}
.promise-icon{width:44px;height:44px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--forest);background:var(--bg-sage);border:var(--bdr-sage);margin-top:2px}
.promise-item h4{font-size:var(--t-base);font-weight:700;color:var(--ink-900);margin-bottom:5px;letter-spacing:-.01em}
.promise-item p{font-size:var(--t-sm);color:var(--ink-500);line-height:1.7}
.testimonial-card{background:var(--forest);border-radius:var(--r-lg);padding:var(--sp-8)}
.tq{font-size:var(--t-md);color:rgba(255,255,255,.85);line-height:1.8;font-style:italic;margin-bottom:var(--sp-6);font-weight:300}
.tauthor{display:flex;align-items:center;gap:var(--sp-3)}
.tavatar{width:42px;height:42px;border-radius:50%;background:var(--forest-lt);color:#fff;font-size:var(--t-xs);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.04em}
.tname{font-size:var(--t-sm);font-weight:700;color:#fff}
.tloc{font-size:var(--t-xs);color:rgba(255,255,255,.45);margin-top:2px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:var(--sp-5);border:var(--bdr);border-radius:var(--r-lg);overflow:hidden;background:#fff}
.stat-box{padding:var(--sp-5);text-align:center;border-right:var(--bdr)}
.stat-box:last-child{border-right:none}
.stat-val{font-size:var(--t-2xl);font-weight:800;color:var(--ink-900);letter-spacing:-.03em;line-height:1;margin-bottom:4px}
.stat-lbl{font-size:var(--t-xs);color:var(--ink-400);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* ── START PROJECT FORM ──────────────────────────────────────────────────── */
.start-sec{background:var(--forest);position:relative;overflow:hidden}
.start-sec::before{content:'';position:absolute;inset:0;opacity:.04;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.start-in{max-width:var(--max);margin:0 auto;padding:var(--sp-16) var(--gutter);position:relative;z-index:1}
.start-header{text-align:center;margin-bottom:var(--sp-10)}
.start-header h2{font-size:clamp(1.6rem,3.5vw,var(--t-3xl));font-weight:800;color:#fff;letter-spacing:-.03em;margin-bottom:var(--sp-3)}
.start-header p{font-size:var(--t-md);color:rgba(255,255,255,.6);max-width:520px;margin:0 auto;font-weight:300;line-height:1.75}
.start-form-card{background:#fff;border-radius:var(--r-xl);padding:clamp(24px,4vw,48px);max-width:760px;margin:0 auto;box-shadow:var(--sh-xl)}
.start-form-title{font-size:var(--t-xl);font-weight:800;color:var(--ink-900);letter-spacing:-.025em;margin-bottom:var(--sp-2)}
.start-form-sub{font-size:var(--t-sm);color:var(--ink-500);margin-bottom:var(--sp-6);line-height:1.6}
.form-divider{font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-400);margin:var(--sp-5) 0 var(--sp-4);padding-bottom:var(--sp-3);border-bottom:var(--bdr)}
.fg{margin-bottom:var(--sp-5)}
.flbl{display:block;font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-600);margin-bottom:6px}
.req{color:var(--red)}
.fi,.fsel,.fta{width:100%;padding:11px 14px;border:1.5px solid var(--ink-200);border-radius:var(--r);font-size:var(--t-sm);color:var(--ink-900);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;font-family:var(--ff)}
.fi:focus,.fsel:focus,.fta:focus{border-color:var(--forest);box-shadow:0 0 0 3px rgba(26,71,49,.1)}
.fi.err,.fsel.err{border-color:var(--red)}
.fta{resize:vertical;min-height:100px;padding:12px 14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
@media(max-width:500px){.frow{grid-template-columns:1fr}}
.fhint{font-size:var(--t-xs);color:var(--ink-400);margin-top:5px;line-height:1.55}
.ferr{font-size:var(--t-xs);color:var(--red);margin-top:4px;font-weight:600}
.serr-box{background:var(--red-pale);border:1px solid #fecaca;border-radius:var(--r);padding:var(--sp-3) var(--sp-4);font-size:var(--t-sm);color:var(--red);margin-bottom:var(--sp-4)}
/* Project type selector */
.project-types{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3);margin-bottom:var(--sp-5)}
@media(max-width:480px){.project-types{grid-template-columns:1fr 1fr}}
.pt-btn{padding:var(--sp-3) var(--sp-2);border:1.5px solid var(--ink-200);border-radius:var(--r-md);background:#fff;cursor:pointer;transition:all .15s;text-align:center;font-family:var(--ff)}
.pt-btn:hover{border-color:var(--forest-lt)}
.pt-btn.sel{border-color:var(--forest);background:var(--bg-sage)}
.pt-icon{font-size:1.4rem;display:block;margin-bottom:4px}
.pt-label{font-size:var(--t-xs);font-weight:700;color:var(--ink-700)}
.pt-btn.sel .pt-label{color:var(--forest)}
.privacy-note{display:flex;gap:var(--sp-3);align-items:flex-start;background:var(--bg-sage);border:var(--bdr-sage);border-radius:var(--r);padding:var(--sp-4);margin-bottom:var(--sp-5);font-size:var(--t-xs);color:var(--ink-600);line-height:1.6}
.submit-btn{width:100%;padding:16px;background:var(--forest);color:#fff;border-radius:var(--r);font-size:var(--t-base);font-weight:800;letter-spacing:.01em;border:none;cursor:pointer;transition:all .2s;box-shadow:0 2px 12px rgba(26,71,49,.25);min-height:56px}
.submit-btn:hover:not(:disabled){background:var(--forest-mid);transform:translateY(-1px);box-shadow:0 4px 20px rgba(26,71,49,.3)}
.submit-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
/* Success state */
.success-card{text-align:center;padding:var(--sp-12) var(--sp-8)}
.success-icon{width:72px;height:72px;background:var(--bg-sage);border:2px solid var(--bdr-sage);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-5);font-size:1.8rem}
.success-title{font-size:var(--t-2xl);font-weight:800;color:var(--ink-900);letter-spacing:-.025em;margin-bottom:var(--sp-3)}
.next-steps-box{background:var(--bg-cool);border:var(--bdr);border-radius:var(--r-lg);padding:var(--sp-5);margin:var(--sp-5) 0;text-align:left}
.next-steps-box h4{font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500);margin-bottom:var(--sp-3)}
.next-step-row{display:flex;gap:var(--sp-3);margin-bottom:var(--sp-2);font-size:var(--t-xs)}
.next-step-row:last-child{margin-bottom:0}
.nsr-time{font-weight:700;color:var(--forest);min-width:100px;flex-shrink:0}
.nsr-desc{color:var(--ink-600)}

/* ── PRICE DIRECTORY (secondary) ─────────────────────────────────────────── */
.prices-sec{background:var(--bg-cool);border-top:var(--bdr)}
.prices-toggle-header{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-6)}
.prices-collapsed-note{font-size:var(--t-sm);color:var(--ink-500)}
.expand-btn{display:flex;align-items:center;gap:8px;font-size:var(--t-sm);font-weight:700;color:var(--forest);background:none;border:none;cursor:pointer;padding:8px 0;transition:color .15s}
.expand-btn:hover{color:var(--forest-mid)}
.expand-chev{transition:transform .25s}
.expand-chev.open{transform:rotate(180deg)}
/* Controls */
.ctrl-bar{display:flex;flex-direction:column;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.ctrl-row{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
.srch-wrap{flex:1;min-width:200px;position:relative}
.srch-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-400);pointer-events:none}
.srch{width:100%;height:44px;padding:0 12px 0 36px;border:1.5px solid var(--ink-200);border-radius:var(--r);font-size:var(--t-sm);background:#fff;color:var(--ink-900);outline:none;transition:border-color .15s}
.srch:focus{border-color:var(--forest)}
.srch::placeholder{color:var(--ink-300)}
.cur-tog{display:flex;border:1.5px solid var(--ink-200);border-radius:var(--r);overflow:hidden;background:#fff;flex-shrink:0}
.cbtn{padding:0 14px;height:44px;font-size:var(--t-xs);font-weight:700;color:var(--ink-400);background:none;cursor:pointer;border-right:1px solid var(--ink-200);border-top:none;border-bottom:none;border-left:none;transition:all .15s}
.cbtn:last-child{border-right:none}
.cbtn.on{background:var(--forest);color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:34px;padding:0 13px;border-radius:100px;font-size:var(--t-xs);font-weight:600;border:1.5px solid var(--ink-200);color:var(--ink-500);background:#fff;cursor:pointer;transition:all .15s;white-space:nowrap}
.pill:hover{border-color:var(--ink-400);color:var(--ink-700)}
.pill.on{background:var(--forest);border-color:var(--forest);color:#fff}
/* Table */
.tbl-wrap{background:#fff;border:var(--bdr);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm)}
.mtbl{width:100%;border-collapse:collapse}
.mtbl thead tr{background:var(--bg-cool);border-bottom:1.5px solid var(--ink-200);position:sticky;top:62px;z-index:10}
.mtbl th{font-size:var(--t-xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-400);padding:11px 20px;text-align:left}
.mtbl td{padding:14px 20px;border-bottom:var(--bdr);font-size:var(--t-sm);vertical-align:middle}
.mtbl tbody tr:last-child td{border-bottom:none}
.mtbl tbody tr:hover td{background:var(--bg-warm)}
.td-name{font-weight:700;color:var(--ink-900);font-size:var(--t-sm);letter-spacing:-.01em}
.td-note{font-size:var(--t-xs);color:var(--ink-400);margin-top:2px}
.td-price{font-size:var(--t-lg);font-weight:800;color:var(--ink-900);letter-spacing:-.025em;white-space:nowrap}
.vbadge{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:700;color:var(--forest)}
.upd{font-size:var(--t-xs);color:var(--ink-300);margin-top:3px}
.pdelta{display:inline-flex;align-items:center;gap:2px;font-size:.63rem;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:5px;vertical-align:middle}
.pdelta.up{background:#fef2f2;color:#b91c1c}
.pdelta.dn{background:#f0fdf4;color:#166534}
.pdelta.nc{background:var(--ink-100);color:var(--ink-400)}
.add-to-q{height:34px;padding:0 14px;background:var(--forest);color:#fff;border-radius:var(--r);font-size:var(--t-xs);font-weight:700;border:none;cursor:pointer;transition:all .15s;white-space:nowrap}
.add-to-q:hover{background:var(--forest-mid)}
.add-to-q.in{background:var(--bg-sage);color:var(--forest);border:1.5px solid var(--bdr-sage)}
/* Mobile cards */
.mcards{display:none;flex-direction:column;gap:var(--sp-3)}
.mcard{background:#fff;border:var(--bdr);border-radius:var(--r-lg);padding:var(--sp-5)}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-4);margin-bottom:var(--sp-4)}
.mc-name{font-weight:700;color:var(--ink-900);font-size:var(--t-base);letter-spacing:-.015em;line-height:1.3}
.mc-cat{font-size:var(--t-xs);color:var(--ink-400);margin-top:3px}
.mc-price{font-size:var(--t-xl);font-weight:800;color:var(--ink-900);letter-spacing:-.025em;text-align:right;white-space:nowrap}
.mc-unit{font-size:var(--t-xs);color:var(--ink-400);text-align:right}
.mc-foot{display:flex;align-items:center;justify-content:space-between;padding-top:var(--sp-4);border-top:var(--bdr);gap:var(--sp-3)}
.mc-add{flex:1;max-width:140px;height:44px;background:var(--forest);color:#fff;border-radius:var(--r);font-size:var(--t-sm);font-weight:700;border:none;cursor:pointer;transition:background .15s}
.mc-add.in{background:var(--bg-sage);color:var(--forest);border:1.5px solid var(--bdr-sage)}
.nores{padding:var(--sp-12) 0;text-align:center;color:var(--ink-400);font-size:var(--t-sm)}
@media(max-width:768px){.tbl-wrap{display:none}.mcards{display:flex}.ctrl-row{flex-direction:column;align-items:stretch}}

/* ── CART DRAWER ─────────────────────────────────────────────────────────── */
.cov{position:fixed;inset:0;background:rgba(13,28,20,.45);z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.cov.open{opacity:1;pointer-events:auto}
.csid{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:#fff;z-index:301;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--sh-xl);display:flex;flex-direction:column;border-left:var(--bdr)}
.csid.open{transform:translateX(0)}
@media(max-width:480px){.csid{top:auto;width:100%;height:92dvh;transform:translateY(100%);border-left:none;border-top:var(--bdr);border-radius:var(--r-xl) var(--r-xl) 0 0}.csid.open{transform:translateY(0)}}
.cs-hdr{padding:18px 20px;background:var(--forest);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cs-title{font-size:var(--t-lg);font-weight:800;color:#fff;letter-spacing:-.02em}
.cs-close{color:rgba(255,255,255,.6);padding:6px;border-radius:var(--r-sm);background:none;border:none;cursor:pointer;display:flex;min-height:44px;min-width:44px;align-items:center;justify-content:center;transition:color .15s}
.cs-close:hover{color:#fff}
.cs-items{flex:1;overflow-y:auto;padding:var(--sp-4);-webkit-overflow-scrolling:touch}
.cs-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--sp-3);padding:var(--sp-8);color:var(--ink-400)}
.ci{border:var(--bdr);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3)}
.ci-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--sp-3);gap:var(--sp-2)}
.ci-name{font-size:var(--t-sm);font-weight:700;color:var(--ink-900);line-height:1.3}
.ci-unit{font-size:var(--t-xs);color:var(--ink-400);margin-top:1px}
.ci-rm{color:var(--ink-300);padding:4px;border-radius:var(--r-sm);background:none;border:none;cursor:pointer;display:flex;transition:color .15s;min-height:32px;min-width:32px;align-items:center;justify-content:center}
.ci-rm:hover{color:var(--red)}
.ci-ctl{display:flex;align-items:center;justify-content:space-between}
.qc{display:flex;align-items:center;gap:var(--sp-2)}
.qb{width:32px;height:32px;border:1.5px solid var(--ink-200);border-radius:var(--r-sm);background:#fff;color:var(--ink-700);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.qb:hover{border-color:var(--forest);color:var(--forest)}
.qv{min-width:30px;text-align:center;font-weight:700;font-size:var(--t-sm)}
.ci-line{font-size:var(--t-base);font-weight:800;color:var(--ink-900);letter-spacing:-.02em}
.cs-ft{padding:var(--sp-4) var(--sp-5);border-top:var(--bdr);background:#fff;flex-shrink:0}
.cs-sub-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.cs-sub-lbl{font-size:var(--t-sm);font-weight:600;color:var(--ink-600)}
.cs-sub-val{font-size:var(--t-2xl);font-weight:800;color:var(--ink-900);letter-spacing:-.03em}
.cs-note{font-size:var(--t-xs);color:var(--ink-400);margin-bottom:var(--sp-4);line-height:1.55}
.cs-btns{display:flex;flex-direction:column;gap:var(--sp-2)}
.bfin{width:100%;height:52px;background:var(--forest);color:#fff;border-radius:var(--r);font-size:var(--t-sm);font-weight:700;border:none;cursor:pointer;transition:all .15s;box-shadow:0 2px 8px rgba(26,71,49,.2)}
.bfin:hover{background:var(--forest-mid);transform:translateY(-1px)}
.bclr{width:100%;height:38px;color:var(--ink-400);border:1.5px solid var(--ink-200);border-radius:var(--r-sm);font-size:var(--t-xs);font-weight:600;background:none;cursor:pointer;transition:all .15s}
.bclr:hover{color:var(--red);border-color:#fecaca;background:var(--red-pale)}

/* ── FAQ ─────────────────────────────────────────────────────────────────── */
.faq-sec{background:var(--bg-warm);border-top:var(--bdr)}
.faq-layout{display:grid;grid-template-columns:1fr;gap:var(--sp-10);margin-top:var(--sp-8)}
@media(min-width:900px){.faq-layout{grid-template-columns:240px 1fr;gap:var(--sp-12)}}
.faq-cats{display:flex;flex-direction:column;gap:2px}
@media(max-width:899px){.faq-cats{flex-direction:row;flex-wrap:wrap;gap:var(--sp-2)}}
.faq-cat-btn{padding:9px 14px;border-radius:var(--r);font-size:var(--t-sm);font-weight:600;color:var(--ink-500);background:none;border:none;cursor:pointer;text-align:left;transition:all .15s}
.faq-cat-btn:hover{background:var(--ink-100);color:var(--ink-900)}
.faq-cat-btn.on{background:var(--bg-sage);color:var(--forest)}
.faq-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.faq-item{background:#fff;border:var(--bdr);border-radius:var(--r-lg);overflow:hidden;transition:box-shadow .15s}
.faq-item.open{box-shadow:var(--sh-sm)}
.faq-q{width:100%;padding:var(--sp-5) var(--sp-6);display:flex;justify-content:space-between;align-items:center;gap:var(--sp-4);background:none;border:none;cursor:pointer;text-align:left;transition:background .15s}
.faq-q:hover{background:var(--bg-warm)}
.faq-q-text{font-size:var(--t-base);font-weight:700;color:var(--ink-900);letter-spacing:-.01em;line-height:1.4}
.faq-chev{flex-shrink:0;color:var(--ink-400);transition:transform .25s}
.faq-item.open .faq-chev{transform:rotate(180deg);color:var(--forest)}
.faq-a{padding:var(--sp-4) var(--sp-6) var(--sp-5);border-top:var(--bdr);font-size:var(--t-sm);color:var(--ink-600);line-height:1.8}
.faq-a p{margin-bottom:var(--sp-3)}
.faq-a p:last-child{margin-bottom:0}
.faq-a ul{margin:var(--sp-2) 0 var(--sp-3) var(--sp-5);display:flex;flex-direction:column;gap:5px}
.faq-a li{font-size:var(--t-sm);color:var(--ink-600)}
.faq-a strong{color:var(--ink-800);font-weight:700}
.faq-show-more{width:100%;padding:var(--sp-4);background:none;border:var(--bdr);border-radius:var(--r-lg);font-size:var(--t-sm);font-weight:700;color:var(--ink-500);cursor:pointer;margin-top:var(--sp-3);transition:all .15s}
.faq-show-more:hover{color:var(--forest);border-color:#c8ddd0;background:var(--bg-sage)}

/* ── TOAST ───────────────────────────────────────────────────────────────── */
.toast{position:fixed;bottom:clamp(16px,3vw,28px);left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink-900);color:#fff;padding:11px 22px;border-radius:var(--r);font-size:var(--t-xs);font-weight:700;letter-spacing:.04em;z-index:500;transition:transform .25s cubic-bezier(.4,0,.2,1);pointer-events:none;white-space:nowrap;box-shadow:var(--sh-lg)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── MOBILE STICKY ───────────────────────────────────────────────────────── */
.mob-sticky{display:none;position:fixed;bottom:0;left:0;right:0;z-index:150;background:#fff;border-top:var(--bdr);padding:var(--sp-3) var(--sp-4);box-shadow:0 -4px 20px rgba(13,28,20,.1)}
@media(max-width:767px){.mob-sticky{display:flex;gap:var(--sp-3);align-items:center}}
.msq-btn{flex:1;height:48px;background:var(--forest);color:#fff;border-radius:var(--r);font-size:var(--t-sm);font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.mswa-btn{width:48px;height:48px;background:#25d366;color:#fff;border-radius:var(--r);display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
@media(max-width:767px){.footer{padding-bottom:calc(var(--sp-8) + 72px)}}

/* ── FLOAT WA ────────────────────────────────────────────────────────────── */
.wa-float{display:none;position:fixed;bottom:28px;right:24px;z-index:150;width:54px;height:54px;background:#25d366;border-radius:50%;box-shadow:0 4px 20px rgba(0,0,0,.2);align-items:center;justify-content:center;text-decoration:none;transition:transform .2s,box-shadow .2s}
.wa-float:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.28)}
@media(min-width:768px){.wa-float{display:flex}}

/* ── FOOTER ──────────────────────────────────────────────────────────────── */
.footer{background:var(--bg-warm);border-top:var(--bdr);padding:var(--sp-12) 0 var(--sp-8)}
.footer-in{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
.footer-top{display:grid;grid-template-columns:1fr;gap:var(--sp-8);padding-bottom:var(--sp-8);border-bottom:var(--bdr);margin-bottom:var(--sp-5)}
@media(min-width:600px){.footer-top{grid-template-columns:1.5fr 1fr 1fr}}
.footer-brand{font-size:var(--t-lg);font-weight:800;color:var(--ink-900);letter-spacing:-.025em;margin-bottom:var(--sp-3)}
.footer-desc{font-size:var(--t-sm);color:var(--ink-500);line-height:1.7;max-width:280px}
.fcol-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-400);margin-bottom:var(--sp-4)}
.flinks{display:flex;flex-direction:column;gap:var(--sp-3)}
.flink{font-size:var(--t-sm);color:var(--ink-500);background:none;border:none;cursor:pointer;text-align:left;padding:0;transition:color .15s;text-decoration:none;display:inline-block}
.flink:hover{color:var(--ink-900)}
.footer-bot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--sp-3)}
.footer-legal{font-size:var(--t-xs);color:var(--ink-400)}

/* PRINT */
.print-only{display:none}
@media print{
  .hdr,.mob-sticky,.wa-float,.cov,.csid,.toast{display:none!important}
  .print-only{display:block!important}
  body{font-size:11pt;color:#000}
}

/* ── BUILD COST CALCULATOR ───────────────────────────────────────────────── */
.calc-sec{background:var(--bg-warm);border-top:var(--bdr);border-bottom:var(--bdr)}
.calc-inner{max-width:760px;margin:0 auto}
.calc-types{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--sp-3);margin-top:var(--sp-8)}
@media(min-width:600px){.calc-types{grid-template-columns:repeat(3,1fr)}}
.calc-type-btn{
  padding:var(--sp-4) var(--sp-3);
  border:1.5px solid var(--ink-200);border-radius:var(--r-md);
  background:#fff;cursor:pointer;text-align:left;
  transition:all .18s;font-family:var(--ff);
}
.calc-type-btn:hover{border-color:var(--forest-lt);box-shadow:var(--sh-xs)}
.calc-type-btn.on{border-color:var(--forest);background:var(--bg-sage);box-shadow:0 0 0 2px rgba(26,71,49,.1)}
.ct-label{font-size:var(--t-sm);font-weight:700;color:var(--ink-800);line-height:1.3;display:block}
.ct-hint{font-size:var(--t-xs);color:var(--ink-400);margin-top:3px;display:block}
.calc-type-btn.on .ct-label{color:var(--forest)}

/* Sliders */
.calc-sliders{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  padding:var(--sp-6);margin-top:var(--sp-5);
  display:flex;flex-direction:column;gap:var(--sp-5);
}
.calc-slider-row{display:flex;flex-direction:column;gap:var(--sp-2)}
.csl-top{display:flex;justify-content:space-between;align-items:baseline}
.csl-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-600)}
.csl-val{font-size:var(--t-base);font-weight:800;color:var(--forest);letter-spacing:-.02em}
.csl-range{
  -webkit-appearance:none;appearance:none;
  width:100%;height:5px;border-radius:3px;
  background:linear-gradient(to right, var(--forest) 0%, var(--forest) var(--pct,50%), var(--ink-200) var(--pct,50%), var(--ink-200) 100%);
  outline:none;cursor:pointer;
}
.csl-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;border:2.5px solid var(--forest);

  "Getting Started":[
    {q:"I want to build a house in The Gambia. Where do I start?",a:["Start by telling Briksafe what you want. Use the 'Start Your Project' form above and describe your vision — how many bedrooms, what area, rough budget, and timeline. That's all we need to get started.","Briksafe will contact you on WhatsApp within 2–3 business days to discuss your project, confirm the scope, and give you an honest cost estimate before any money changes hands.","You don't need to know anything about materials, contractors, or the building process. That's exactly what Briksafe is here to manage for you."]},
    {q:"Do I need to be in The Gambia to use Briksafe?",a:["No — that is the whole point. Briksafe is specifically designed for people building from the UK, USA, Europe, and elsewhere. You manage everything remotely through WhatsApp.","We act as your eyes and hands on the ground. We visit the site, supervise the contractors, check the materials, and send you regular photo and video updates so you can see exactly what is happening."]},
    {q:"What if I don't have a plot of land yet?",a:["We can still help you plan. Tell us the area you are interested in and the type of project, and we will give you estimated costs to help you budget and decide.","When you are ready with land, Briksafe can also help you source trusted contacts for land verification and documentation, though legal land registration is handled by qualified Gambian lawyers, not Briksafe."]},
    {q:"How much does it cost to use Briksafe?",a:["Briksafe charges a service fee for managing your project. This fee is always discussed and agreed with you before any work begins — it is never hidden inside material prices.","The fee varies depending on the scope of the project. For a full house build, it is typically a percentage of the total project cost. For smaller jobs like fencing or a room extension, we agree a fixed management fee.","Everything is transparent. You will see exactly what materials cost, what contractors are paid, and what our fee is — separately and clearly."]},
  ],
  "How Briksafe Works":[
    {q:"How does Briksafe manage contractors?",a:["Briksafe only works with contractors we have personally vetted. We check their previous work, speak to past clients, and assess the quality of their builds before we recommend them for any project.","Once a contractor is engaged on your project, Briksafe supervises their work on the ground. We conduct site visits at key milestones — foundation, walls, roof, and finishing — and send you photo documentation at each stage.","If the work is not to the agreed standard, we stop the contractor before more money is paid. You are never pressured to release the next phase payment until Briksafe has confirmed the previous phase is complete and correct."]},
    {q:"How are payments structured?",a:["All payments are phased to protect you. You never pay for the next stage until the current stage has been inspected and approved by Briksafe.","A typical structure: initial deposit to secure materials → payment on foundation completion → payment at wall plate level → final payment on practical completion. We agree the exact structure with you before anything starts.","We will never ask for full payment upfront. Any service that does is a red flag."]},
    {q:"What photo and video proof do I get?",a:["Photo and video updates are a standard part of every Briksafe project — not an add-on.","At a minimum, you receive: photos of materials at the supplier before purchase, photos of materials delivered to site, photos at each construction milestone, and a final photo and video walkthrough on completion.","For active builds, we provide weekly WhatsApp updates so you always know what is happening, even when you are thousands of miles away."]},
    {q:"What happens if something goes wrong?",a:["If a contractor does poor work, Briksafe will stop the project, document the issue, and arrange for it to be corrected before proceeding. You do not pay for work that is not done properly.","If a material is delivered incorrectly or below specification, Briksafe handles the return and replacement directly with the supplier. You are not left to deal with this from abroad.","If you are unhappy with any part of the service, you contact Briksafe directly on WhatsApp and we resolve it. We do not use call centres or automated systems — a real person handles every issue."]},

    {q:"How do you make sure I don't overpay for materials?",a:["Briksafe publishes real market prices from Gambian suppliers every week, sourced from Serrekunda, Kanifing, and Brikama markets. These are the baseline we use for every order.","We purchase materials from our vetted suppliers at fair market rates. You see exactly what each item costs before we buy it. We never add a hidden markup on materials — our income comes from the agreed service fee only.","You can also use the price directory on this page to cross-check any quote you receive from other contractors or suppliers."]},

const CC=createContext(null);
function CartProvider({children}){
  const[items,set]=useState([]);
  const add   =useCallback(m=>set(p=>p.find(i=>i.id===m.id)?p:[...p,{...m,qty:1}]),[]);
  const remove=useCallback(id=>set(p=>p.filter(i=>i.id!==id)),[]);
  const setQty=useCallback((id,q)=>{if(q<1)return;set(p=>p.map(i=>i.id===id?{...i,qty:q}:i));},[]);
  const clear =useCallback(()=>set([]),[]);
  const count =items.reduce((s,i)=>s+i.qty,0);
  return h(CC.Provider,{value:{items,add,remove,setQty,clear,count}},children);
}
const useCart=()=>useContext(CC);

    const e={};

    if(!form.whatsapp.trim()) e.whatsapp="Required";
    if(!form.location) e.location="Required";

  async function onSubmit(e){
    e.preventDefault();
    const v=validate();
    if(Object.keys(v).length){setErrs(v);return;}
    setErrs({});setBusy(true);setSErr("");

          project_type: selectedType?selectedType.label:type,

/* ── PRICE DIRECTORY ─────────────────────────────────────────────────────── */
function PriceDirectory(){
  const{add,items}=useCart();
  const[expanded,setExpanded]=useState(false);
  const[q,setQ]=useState("");
  const[cat,setCat]=useState("All");
  const[currency,setCurrency]=useState(()=>{try{return localStorage.getItem('briksafe_currency')||'GMD';}catch{return 'GMD';}});
  const[toast,setToast]=useState({show:false,msg:""});
  const[justAdded,setJustAdded]=useState({});

  function saveCur(c){setCurrency(c);try{localStorage.setItem('briksafe_currency',c);}catch{}}
  const inCart=useCallback(id=>items.some(i=>i.id===id),[items]);

  const filtered=useMemo(()=>MATS.filter(m=>{
    const lq=q.toLowerCase().trim();
    return(!lq||m.name.toLowerCase().includes(lq)||m.cat.toLowerCase().includes(lq))&&(cat==="All"||m.cat===cat);
  }),[q,cat]);

  const isFiltering=q.trim()!==""||cat!=="All";
  const displayed=isFiltering||expanded?filtered:MATS.slice(0,4);

  function doAdd(m){
    if(inCart(m.id))return;
    add(m);
    setJustAdded(p=>({...p,[m.id]:true}));
    setTimeout(()=>setJustAdded(p=>({...p,[m.id]:false})),1500);
    setToast({show:true,msg:m.name+" added to price list"});
    setTimeout(()=>setToast({show:false,msg:""}),2200);
  }

  function DeltaBadge({delta}){
    if(!delta)return null;
    if(delta===0)return h('span',{className:"pdelta nc"},"\u2192 0%");
    if(delta>0) return h('span',{className:"pdelta up"},"\u2191 +"+delta+"%");
    return h('span',{className:"pdelta dn"},"\u2193 "+delta+"%");

  return h('section',{id:"materials",className:"sec prices-sec"},

      // Delta legend
      h('div',{style:{display:"flex",alignItems:"center",gap:"var(--sp-3)",flexWrap:"wrap",marginBottom:"var(--sp-5)",fontSize:"var(--t-xs)",color:"var(--ink-400)"}},
        h('span',null,"Price changes since last update:"),
        h('span',{style:{background:"#fef2f2",color:"#b91c1c",padding:"2px 7px",borderRadius:"3px",fontWeight:700}},"\u2191 Increased"),
        h('span',{style:{background:"#f0fdf4",color:"#166534",padding:"2px 7px",borderRadius:"3px",fontWeight:700}},"\u2193 Decreased"),
        h('span',{style:{background:"var(--ink-100)",color:"var(--ink-400)",padding:"2px 7px",borderRadius:"3px",fontWeight:700}},"\u2192 No change")
      ),

      h('div',{className:"ctrl-bar"},
        h('div',{className:"ctrl-row"},
          h('div',{className:"srch-wrap"},
            h(ISearch),
            h('input',{className:"srch",type:"search",placeholder:"Search all materials\u2026",value:q,onChange:e=>{setQ(e.target.value);if(!expanded)setExpanded(true);}, "aria-label":"Search"})
          ),

          h('div',{key:"tbl",className:"tbl-wrap"},

function fmtGMD(n){
  if(n>=1000000)return"D\u202f"+(n/1000000).toFixed(1).replace(/\.0$/,"")+"M";
  if(n>=1000)   return"D\u202f"+(n/1000).toFixed(0)+"k";
  return"D\u202f"+n.toLocaleString('en-GB');
}

function BuildCostCalc(){
  const[selected,setSelected]=useState(null);
  const proj=CALC_PROJECTS.find(p=>p.id===selected)||null;

  const getDefaults=useCallback(p=>p?Object.fromEntries(p.sliders.map(s=>[s.id,s.def])):{},[]);
  const[vals,setVals]=useState({});
  useEffect(()=>{if(proj)setVals(getDefaults(proj));},[proj,getDefaults]);

  const mergedVals=useMemo(()=>proj?{...getDefaults(proj),...vals}:{},[proj,vals,getDefaults]);
  const result=useMemo(()=>{
    if(!proj)return null;
    try{return proj.estimate(mergedVals);}catch{return null;}
  },[proj,mergedVals]);

  function setVal(id,val){setVals(p=>({...p,[id]:parseFloat(val)}));}

  const IArr=()=>Ico([['line',{x1:5,y1:12,x2:19,y2:12}],['polyline',{points:"12 5 19 12 12 19"}]],{width:13,height:13});

  function RangeSlider({s}){
    const val=mergedVals[s.id]!==undefined?mergedVals[s.id]:s.def;
    const pct=((val-s.min)/(s.max-s.min)*100).toFixed(1);
    return h('div',{className:"calc-slider-row"},
      h('div',{className:"csl-top"},
        h('span',{className:"csl-label"},s.label),
        h('span',{className:"csl-val"},s.format(val))
      ),
      h('input',{
        type:"range",className:"csl-range",
        min:s.min,max:s.max,step:s.step,value:val,
        style:{"--pct":pct+"%"},
        onChange:e=>setVal(s.id,e.target.value),
        "aria-label":s.label,
        "aria-valuetext":s.format(val),
      }),
      h('div',{className:"csl-minmax"},
        h('span',null,s.format(s.min)),
        h('span',null,s.format(s.max))
      )
    );
  }

  return h('section',{id:"cost-calculator",className:"sec calc-sec"},
    h('div',{className:"wrap"},
      h('div',{className:"calc-inner"},
        h('div',{className:"eyebrow"},"Build Cost Calculator"),
        h('h2',{className:"sec-title"},"What does a build like yours actually cost?"),
        h('p',{className:"sec-sub"},
          "Pick your project and adjust the sliders. You\u2019ll get an honest cost range based on real Gambian construction costs \u2014 and plain-language explanations of what drives the difference."
        ),

        h('div',{className:"calc-types","aria-label":"Choose a project type"},
          ...CALC_PROJECTS.map(p=>h('button',{
            key:p.id,
            className:"calc-type-btn"+(selected===p.id?" on":""),
            onClick:()=>setSelected(selected===p.id?null:p.id),
            "aria-pressed":selected===p.id,
          },
            h('span',{className:"ct-label"},p.label),
            h('span',{className:"ct-hint"},p.hint)
          ))
        ),

        proj&&h('div',{className:"calc-sliders"},
          ...proj.sliders.map(s=>h(RangeSlider,{key:s.id,s}))
        ),

        result&&h('div',{className:"calc-result","aria-live":"polite","aria-atomic":"true"},
          h('div',{className:"cr-eyebrow"},"Estimated cost range"),
          h('div',{className:"cr-headline"},
            result.headline+" typically costs between ",
            h('em',null,fmtGMD(result.low)+" and "+fmtGMD(result.high)),"."
          ),
          h('div',{className:"cr-range-bar"},
            h('div',{className:"cr-range-fill",style:{width:"100%"}})
          ),
          h('div',{className:"cr-range-labels"},
            h('span',null,"Lower end: ",h('strong',null,fmtGMD(result.low))),
            h('span',null,"Upper end: ",h('strong',null,fmtGMD(result.high)))
          ),
          h('div',{className:"cr-drivers"},
            h('div',{className:"cr-drivers-label"},"What drives the difference"),
            ...result.drivers.map((d,i)=>h('div',{key:i,className:"cr-driver"},
              h('span',{className:"cr-driver-dot"}),
              h('p',{className:"cr-driver-text"},d.t)
            ))
          ),
          h('div',{className:"cr-cta"},
            h('p',{className:"cr-cta-note"},
              "This is a planning guide, not a formal quote. Start your project with Briksafe and we\u2019ll prepare an itemised estimate based on your actual site and requirements \u2014 at no cost."
            ),
            h('button',{className:"cr-btn",onClick:()=>go("start")},"Start my project ",h(IArr))
          )
        ),

        !selected&&h('p',{style:{textAlign:"center",color:"var(--ink-400)",fontSize:"var(--t-sm)",marginTop:"var(--sp-6)",lineHeight:"1.6"}},
          "Select a project type above to see your cost range."
        ),

        h('p',{className:"calc-disclaimer"},
          "Estimates based on typical Gambian construction costs, mid-2026. Material prices, contractor rates, and site conditions vary. Always confirm with Briksafe before making financial decisions."
        )
      )
    )
  );
}

/* ── FAQ ─────────────────────────────────────────────────────────────────── */
function FAQ(){
  const cats=Object.keys(FAQ_DATA);
  const[activeCat,setActiveCat]=useState(cats[0]);
  const[openIdx,setOpenIdx]=useState(null);
  const[showAll,setShowAll]=useState(false);
  const faqs=FAQ_DATA[activeCat]||[];
  const displayed=showAll?faqs:faqs.slice(0,3);
  function toggle(i){setOpenIdx(openIdx===i?null:i);}
  return h('section',{id:"faq",className:"sec faq-sec"},
    h('div',{className:"wrap"},
      h('div',{className:"eyebrow"},"FAQ"),
      h('h2',{className:"sec-title"},"Questions we get asked a lot."),
      h('p',{className:"sec-sub"},"Everything you need to know before starting your project with Briksafe."),
      h('div',{className:"faq-layout"},
        h('nav',{className:"faq-cats","aria-label":"FAQ categories"},
          ...cats.map(c=>h('button',{key:c,className:"faq-cat-btn"+(activeCat===c?" on":""),onClick:()=>{setActiveCat(c);setOpenIdx(null);setShowAll(false);}},c))
        ),
        h('div',null,
          h('div',{className:"faq-list"},
            ...displayed.map((faq,i)=>h('div',{key:i,className:"faq-item"+(openIdx===i?" open":"")},
              h('button',{className:"faq-q",onClick:()=>toggle(i),"aria-expanded":openIdx===i},
                h('span',{className:"faq-q-text"},faq.q),
                h('span',{className:"faq-chev"},h(IChevron))
              ),
              openIdx===i&&h('div',{className:"faq-a"},...faq.a.map((para,j)=>h('p',{key:j},para)))
            ))
          ),
          faqs.length>3&&h('button',{className:"faq-show-more",onClick:()=>{setShowAll(v=>!v);setOpenIdx(null);}},
            showAll?"\u2191 Show fewer":"Show "+(faqs.length-3)+" more questions"
          ),
          h('div',{style:{marginTop:"var(--sp-6)",padding:"var(--sp-5)",background:"var(--bg-sage)",border:"var(--bdr-sage)",borderRadius:"var(--r-lg)",display:"flex",gap:"var(--sp-4)",alignItems:"center",flexWrap:"wrap"}},
            h('p',{style:{fontSize:"var(--t-sm)",color:"var(--ink-700)",fontWeight:600,flex:1}},"Still have questions? Message us directly on WhatsApp."),
            h('a',{href:"https://wa.me/2203569784",target:"_blank",rel:"noopener noreferrer",className:"wa-btn",style:{fontSize:"var(--t-xs)",padding:"10px 18px",minHeight:"40px"}},h(IWp),"Chat on WhatsApp")
          )
        )
      )
    )
  );
}
