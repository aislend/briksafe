<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Briksafe — Trusted Building Materials for the Gambian Diaspora</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&display=swap" rel="stylesheet"/>
<style>
/* ── RESET ─────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
img,svg{display:block;max-width:100%}

/* ── TOKENS ────────────────────────────────────────────────────────────── */
:root{
  /* Surfaces — all light */
  --bg        :#ffffff;
  --bg-warm   :#f7f5f0;   /* warm off-white / linen */
  --bg-cool   :#f4f7f9;   /* very pale blue-grey */
  --bg-accent :#eef4f0;   /* pale sage */

  /* Ink */
  --ink-900:#0d1c14;  /* darkest, used for headings — very dark green-black */
  --ink-700:#2d4035;
  --ink-600:#445c4a;
  --ink-500:#6b7f71;
  --ink-400:#96a89b;
  --ink-300:#c2cec6;
  --ink-200:#dde5df;
  --ink-100:#eef2ef;

  /* Brand */
  --forest    :#1a4731;   /* primary brand — deep forest green */
  --forest-mid:#256040;   /* hover / active */
  --forest-lt :#3d8c5e;   /* lighter accent */
  --sage      :#7aab8a;   /* soft accent */
  --sage-pale :#d6ead e;

  /* Highlight */
  --gold      :#c8943a;   /* warm amber — for trust badges, verified */
  --gold-pale :#fdf3e0;

  /* Error */
  --red       :#b91c1c;
  --red-pale  :#fef2f2;

  /* Type */
  --ff:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;

  /* Fluid type — min at 360px, max at 1280px */
  --t-xs :0.6875rem;
  --t-sm :0.8125rem;
  --t-base:0.9375rem;
  --t-md :1.0625rem;
  --t-lg :1.1875rem;
  --t-xl :1.4375rem;
  --t-2xl:1.875rem;
  --t-3xl:2.375rem;
  --t-4xl:3rem;
  --t-hero:clamp(2rem,6vw,3.75rem);

  /* Spacing */
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;
  --sp-6:24px;--sp-8:32px;--sp-10:40px;--sp-12:48px;
  --sp-16:64px;--sp-20:80px;--sp-24:96px;

  /* Radius */
  --r-sm:4px;--r:6px;--r-md:10px;--r-lg:16px;--r-xl:24px;

  /* Borders */
  --bdr      :1px solid var(--ink-200);
  --bdr-sage :1px solid #c8ddd0;

  /* Shadows */
  --sh-xs:0 1px 2px rgba(13,28,20,.05);
  --sh-sm:0 1px 4px rgba(13,28,20,.07),0 2px 8px rgba(13,28,20,.04);
  --sh   :0 2px 12px rgba(13,28,20,.08),0 4px 24px rgba(13,28,20,.04);
  --sh-lg:0 8px 32px rgba(13,28,20,.10),0 2px 8px rgba(13,28,20,.05);
  --sh-xl:0 20px 64px rgba(13,28,20,.13),0 4px 16px rgba(13,28,20,.06);

  /* Layout */
  --max:1200px;
  --gutter:clamp(16px,4vw,40px);
}

/* ── BASE ──────────────────────────────────────────────────────────────── */
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:var(--ff);font-size:var(--t-base);
  line-height:1.65;color:var(--ink-700);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
h1,h2,h3,h4,h5{
  font-family:var(--ff);font-weight:700;
  color:var(--ink-900);line-height:1.2;
  letter-spacing:-0.02em;
}
p{color:var(--ink-600);line-height:1.75}
button{cursor:pointer;border:none;background:none;font-family:var(--ff)}
input,select,textarea{font-family:var(--ff)}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--ink-300);border-radius:3px}

/* ── LAYOUT HELPERS ────────────────────────────────────────────────────── */
.wrap{max-width:var(--max);margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter)}
.sec{padding:var(--sp-16) 0}
@media(min-width:768px){.sec{padding:var(--sp-24) 0}}

/* Section header */
.sec-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:var(--t-xs);font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--forest-lt);margin-bottom:var(--sp-4);
}
.sec-eyebrow::before{content:'';width:18px;height:1.5px;background:var(--forest-lt);border-radius:1px}
.sec-title{
  font-size:clamp(1.5rem,3.5vw,var(--t-3xl));
  font-weight:800;color:var(--ink-900);
  letter-spacing:-0.03em;margin-bottom:var(--sp-3);
  line-height:1.15;
}
.sec-sub{
  font-size:var(--t-base);color:var(--ink-500);
  line-height:1.8;max-width:520px;font-weight:400;
}

/* ── HEADER ────────────────────────────────────────────────────────────── */
.hdr{
  position:fixed;top:0;left:0;right:0;z-index:300;
  height:60px;
  background:rgba(255,255,255,0.96);
  border-bottom:var(--bdr);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.hdr-in{
  max-width:var(--max);margin:0 auto;
  padding:0 var(--gutter);height:100%;
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-4);
}
.logo-btn{
  display:flex;align-items:center;gap:9px;
  background:none;border:none;cursor:pointer;flex-shrink:0;
}
.logo-mark{
  width:32px;height:32px;
  background:var(--forest);
  border-radius:var(--r);
  display:flex;align-items:center;justify-content:center;
  font-size:.85rem;flex-shrink:0;
}
.logo-text{
  font-size:1.05rem;font-weight:800;
  color:var(--ink-900);letter-spacing:-0.03em;
}
.logo-tagline{
  font-size:.6rem;font-weight:600;
  color:var(--ink-400);letter-spacing:.06em;
  text-transform:uppercase;display:block;
  line-height:1;margin-top:1px;
}
.nav{display:none}
@media(min-width:768px){
  .nav{display:flex;align-items:center;gap:2px}
  .nl{
    font-size:var(--t-sm);font-weight:500;
    color:var(--ink-500);
    padding:7px 13px;border-radius:var(--r-sm);
    background:none;border:none;cursor:pointer;
    transition:color .15s,background .15s;white-space:nowrap;
  }
  .nl:hover{color:var(--ink-900);background:var(--ink-100)}
}
.hdr-right{display:flex;align-items:center;gap:var(--sp-2)}
.cart-btn{
  display:flex;align-items:center;gap:6px;
  font-size:var(--t-sm);font-weight:600;
  color:var(--forest);
  padding:8px 14px;border-radius:var(--r);
  border:1.5px solid var(--ink-200);
  background:var(--bg);
  transition:all .15s;cursor:pointer;
  position:relative;white-space:nowrap;
  min-height:44px;
}
.cart-btn:hover{border-color:var(--forest);background:var(--bg-accent)}
.cbadge{
  background:var(--forest);color:#fff;
  font-size:.6rem;font-weight:800;
  min-width:16px;height:16px;border-radius:8px;
  padding:0 3px;
  display:inline-flex;align-items:center;justify-content:center;
}
.hbg{
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-700);padding:8px;border-radius:var(--r-sm);
  background:none;border:none;cursor:pointer;min-height:44px;min-width:44px;
}
@media(min-width:768px){.hbg{display:none}}
.mob-nav{
  position:fixed;top:60px;left:0;right:0;
  background:#fff;border-bottom:var(--bdr);
  padding:var(--sp-3);z-index:299;
  box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;gap:2px;
}
.mob-nl{
  font-size:var(--t-base);font-weight:500;
  color:var(--ink-600);padding:12px 14px;
  border-radius:var(--r);background:none;border:none;cursor:pointer;text-align:left;
  min-height:44px;transition:background .15s;
}
.mob-nl:hover{background:var(--bg-warm);color:var(--ink-900)}

/* ── HERO ──────────────────────────────────────────────────────────────── */
.hero{
  background:var(--bg-warm);
  padding:calc(60px + clamp(48px,8vw,96px)) var(--gutter) clamp(48px,8vw,96px);
  border-bottom:var(--bdr);
  position:relative;
  overflow:hidden;
}
/* Subtle decorative element */
.hero-deco{
  position:absolute;right:-80px;top:-80px;
  width:320px;height:320px;
  background:radial-gradient(circle,rgba(61,140,94,.08) 0%,transparent 70%);
  border-radius:50%;pointer-events:none;
}
@media(min-width:768px){
  .hero-deco{width:560px;height:560px;right:-120px;top:-120px}
}
.hero-in{
  max-width:var(--max);margin:0 auto;
  display:grid;gap:clamp(36px,5vw,64px);
  position:relative;z-index:1;
}
@media(min-width:900px){
  .hero-in{grid-template-columns:1fr 380px;align-items:center}
}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:var(--t-xs);font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--forest-lt);margin-bottom:var(--sp-5);
}
.hero-dot{
  width:6px;height:6px;background:var(--forest-lt);
  border-radius:50%;
  animation:pulse 2.5s ease-in-out infinite;
  flex-shrink:0;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.hero h1{
  font-size:var(--t-hero);
  font-weight:800;color:var(--ink-900);
  letter-spacing:-0.035em;line-height:1.1;
  margin-bottom:var(--sp-5);
}
.hero h1 em{font-style:normal;color:var(--forest)}
.hero-sub{
  font-size:var(--t-md);color:var(--ink-500);
  line-height:1.75;max-width:500px;
  margin-bottom:var(--sp-8);font-weight:400;
}
.hero-ctas{display:flex;flex-wrap:wrap;gap:var(--sp-3)}
.btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  font-size:var(--t-sm);font-weight:700;
  background:var(--forest);color:#fff;
  padding:13px 24px;border-radius:var(--r);
  border:none;cursor:pointer;
  transition:background .15s,transform .15s,box-shadow .15s;
  letter-spacing:.01em;min-height:48px;
  box-shadow:0 2px 8px rgba(26,71,49,.25);
}
.btn-primary:hover{background:var(--forest-mid);transform:translateY(-1px);box-shadow:0 4px 16px rgba(26,71,49,.3)}
.btn-outline{
  display:inline-flex;align-items:center;gap:8px;
  font-size:var(--t-sm);font-weight:600;
  background:transparent;color:var(--ink-700);
  padding:12px 24px;border-radius:var(--r);
  border:1.5px solid var(--ink-200);cursor:pointer;
  transition:all .15s;min-height:48px;
}
.btn-outline:hover{border-color:var(--ink-400);color:var(--ink-900);background:var(--bg)}
.hero-metrics{
  display:flex;gap:clamp(20px,4vw,48px);
  margin-top:var(--sp-10);
  padding-top:var(--sp-8);
  border-top:var(--bdr);
  flex-wrap:wrap;
}
.hm-val{
  font-size:var(--t-2xl);font-weight:800;
  color:var(--ink-900);letter-spacing:-0.03em;line-height:1;
  margin-bottom:4px;
}
.hm-lbl{
  font-size:var(--t-xs);color:var(--ink-400);
  text-transform:uppercase;letter-spacing:.09em;font-weight:600;
}

/* HERO PANEL */
.hero-panel{
  background:#fff;border:var(--bdr);
  border-radius:var(--r-lg);
  box-shadow:var(--sh-lg);
  overflow:hidden;
}
.hp-hdr{
  padding:14px 20px;
  background:var(--forest);
  display:flex;justify-content:space-between;align-items:center;
}
.hp-htitle{
  font-size:var(--t-xs);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.7);
}
.hp-live{
  display:flex;align-items:center;gap:5px;
  font-size:var(--t-xs);color:rgba(255,255,255,.85);
  font-weight:600;letter-spacing:.05em;text-transform:uppercase;
}
.hp-live-dot{
  width:5px;height:5px;background:#fff;border-radius:50%;
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.hp-row{
  padding:14px 20px;border-bottom:var(--bdr);
  display:flex;justify-content:space-between;align-items:baseline;
}
.hp-row:last-of-type{border-bottom:none}
.hp-name{font-size:var(--t-sm);color:var(--ink-600);font-weight:400}
.hp-price{font-size:var(--t-lg);font-weight:800;color:var(--ink-900);letter-spacing:-0.02em}
.hp-unit{font-size:var(--t-xs);color:var(--ink-400);margin-left:3px;font-weight:400}
.hp-footer{
  padding:14px 20px;background:var(--bg-accent);
  border-top:var(--bdr-sage);
}
.hp-ti{
  display:flex;align-items:center;gap:7px;
  font-size:var(--t-xs);color:var(--ink-600);
  margin-bottom:6px;
}
.hp-ti:last-child{margin-bottom:0}
.hp-tick{color:var(--forest-lt);flex-shrink:0}

/* ── MATERIALS ─────────────────────────────────────────────────────────── */
.mat-sec{background:var(--bg)}
.mat-header{
  display:flex;flex-direction:column;gap:var(--sp-5);
  margin-bottom:var(--sp-8);
}
@media(min-width:768px){
  .mat-header-top{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--sp-6)}
}
.ctrl-bar{
  display:flex;flex-direction:column;gap:var(--sp-3);
  margin-bottom:var(--sp-5);
}
.ctrl-row{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap}
.srch-wrap{flex:1;min-width:180px;position:relative}
.srch-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-400);pointer-events:none}
.srch{
  width:100%;height:44px;padding:0 12px 0 36px;
  border:1.5px solid var(--ink-200);border-radius:var(--r);
  font-size:var(--t-sm);color:var(--ink-900);background:#fff;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.srch:focus{border-color:var(--forest);box-shadow:0 0 0 3px rgba(26,71,49,.1)}
.srch::placeholder{color:var(--ink-300)}
.cur-tog{
  display:flex;border:1.5px solid var(--ink-200);
  border-radius:var(--r);overflow:hidden;flex-shrink:0;background:#fff;
}
.cbtn{
  padding:0 14px;height:44px;
  font-size:var(--t-xs);font-weight:700;letter-spacing:.04em;
  color:var(--ink-400);background:none;cursor:pointer;
  border-right:1px solid var(--ink-200);
  border-top:none;border-bottom:none;border-left:none;
  transition:all .15s;white-space:nowrap;
}
.cbtn:last-child{border-right:none}
.cbtn.on{background:var(--forest);color:#fff;border-right-color:var(--forest-mid)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  height:36px;padding:0 14px;border-radius:100px;
  font-size:var(--t-xs);font-weight:600;letter-spacing:.02em;
  border:1.5px solid var(--ink-200);color:var(--ink-500);
  background:#fff;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.pill:hover{border-color:var(--ink-400);color:var(--ink-800,var(--ink-700))}
.pill.on{background:var(--forest);border-color:var(--forest);color:#fff}
/* Results count */
.results-count{font-size:var(--t-xs);color:var(--ink-400);font-weight:500;padding:4px 0}

/* TABLE */
.tbl-wrap{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--sh-sm);
}
.mtbl{width:100%;border-collapse:collapse}
.mtbl thead{background:var(--bg-cool);border-bottom:1.5px solid var(--ink-200)}
.mtbl th{
  font-size:var(--t-xs);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-500);
  padding:11px 20px;text-align:left;white-space:nowrap;
}
.mtbl td{
  padding:15px 20px;border-bottom:var(--bdr);
  vertical-align:middle;
}
.mtbl tbody tr:last-child td{border-bottom:none}
.mtbl tbody tr{transition:background .1s}
.mtbl tbody tr:hover td{background:var(--bg-warm)}
.td-name{font-size:var(--t-sm);font-weight:700;color:var(--ink-900);letter-spacing:-0.01em}
.td-note{font-size:var(--t-xs);color:var(--ink-400);margin-top:2px;font-weight:400}
.td-price{font-size:var(--t-lg);font-weight:800;color:var(--ink-900);letter-spacing:-0.025em;white-space:nowrap}
.vbadge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:var(--t-xs);font-weight:700;
  color:var(--forest);letter-spacing:.02em;
}
.upd{font-size:var(--t-xs);color:var(--ink-300);margin-top:3px}
.add-btn{
  height:36px;padding:0 14px;
  background:var(--forest);color:#fff;
  border-radius:var(--r);
  font-size:var(--t-xs);font-weight:700;letter-spacing:.03em;
  border:none;cursor:pointer;
  transition:background .15s,opacity .15s;
  white-space:nowrap;min-width:100px;
}
.add-btn:hover{background:var(--forest-mid)}
.add-btn.in{background:var(--bg-accent);color:var(--forest);border:1.5px solid var(--bdr-sage)}
.add-btn.in:hover{background:#dceae0}

/* MOBILE CARDS */
.mcards{display:none;flex-direction:column;gap:var(--sp-3)}
.mcard{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  padding:var(--sp-5);transition:box-shadow .15s;
}
.mcard:active{box-shadow:var(--sh)}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-4);margin-bottom:var(--sp-4)}
.mc-name{font-size:var(--t-base);font-weight:700;color:var(--ink-900);letter-spacing:-0.015em;line-height:1.3}
.mc-cat{font-size:var(--t-xs);color:var(--ink-400);margin-top:3px;font-weight:500}
.mc-price{font-size:var(--t-2xl);font-weight:800;color:var(--ink-900);letter-spacing:-0.03em;text-align:right;white-space:nowrap}
.mc-unit{font-size:var(--t-xs);color:var(--ink-400);text-align:right;margin-top:2px}
.mc-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:var(--sp-4);border-top:var(--bdr);gap:var(--sp-3);
}
.mc-add{
  height:44px;padding:0 18px;flex:1;
  background:var(--forest);color:#fff;
  border-radius:var(--r);font-size:var(--t-sm);font-weight:700;
  border:none;cursor:pointer;transition:background .15s;
}
.mc-add:active{background:var(--forest-mid)}
.mc-add.in{background:var(--bg-accent);color:var(--forest);border:1.5px solid var(--bdr-sage)}
.nores{padding:var(--sp-16) 0;text-align:center;color:var(--ink-400);font-size:var(--t-sm)}

@media(max-width:767px){
  .tbl-wrap{display:none}
  .mcards{display:flex}
  .ctrl-row{flex-direction:column;align-items:stretch}
  .srch-wrap{min-width:unset}
  .cur-tog{align-self:flex-start}
}

/* ── HOW IT WORKS ──────────────────────────────────────────────────────── */
.how-sec{background:var(--bg-warm);border-top:var(--bdr);border-bottom:var(--bdr)}
.steps{
  display:grid;gap:var(--sp-4);
  grid-template-columns:1fr;
  margin-top:var(--sp-10);
}
@media(min-width:600px){.steps{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.steps{grid-template-columns:repeat(4,1fr)}}
.step-card{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  padding:var(--sp-6) var(--sp-5);
  position:relative;
}
.step-num{
  font-size:var(--t-xs);font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--forest-lt);
  margin-bottom:var(--sp-5);
  display:flex;align-items:center;gap:8px;
}
.step-num-circle{
  width:28px;height:28px;border-radius:50%;
  background:var(--bg-accent);
  border:1.5px solid var(--bdr-sage);
  display:flex;align-items:center;justify-content:center;
  font-size:var(--t-xs);font-weight:800;color:var(--forest);
}
.step h3{font-size:var(--t-base);font-weight:700;color:var(--ink-900);margin-bottom:8px;letter-spacing:-0.01em}
.step p{font-size:var(--t-sm);color:var(--ink-500);line-height:1.7}

/* ── TRUST ─────────────────────────────────────────────────────────────── */
.trust-sec{background:var(--bg)}
.trust-layout{
  display:grid;gap:var(--sp-12);
  grid-template-columns:1fr;
  margin-top:var(--sp-10);
}
@media(min-width:900px){.trust-layout{grid-template-columns:1fr 1fr;gap:var(--sp-16);align-items:start}}
.trust-list{display:flex;flex-direction:column;gap:0}
.trust-row{
  display:flex;gap:var(--sp-4);align-items:flex-start;
  padding:var(--sp-5) 0;border-bottom:var(--bdr);
}
.trust-row:last-child{border-bottom:none}
.trust-icon{
  width:40px;height:40px;flex-shrink:0;
  border-radius:var(--r);border:var(--bdr);
  background:#fff;display:flex;align-items:center;justify-content:center;
  color:var(--forest);margin-top:2px;
  box-shadow:var(--sh-xs);
}
.trust-row h4{font-size:var(--t-base);font-weight:700;color:var(--ink-900);margin-bottom:5px;letter-spacing:-0.01em}
.trust-row p{font-size:var(--t-sm);color:var(--ink-500);line-height:1.7}
.trust-right{display:flex;flex-direction:column;gap:var(--sp-4)}
.testimonial{
  background:var(--forest);border-radius:var(--r-lg);
  padding:var(--sp-8);
}
.tq{
  font-size:var(--t-md);color:rgba(255,255,255,.85);
  line-height:1.75;margin-bottom:var(--sp-6);
  font-weight:300;font-style:italic;
}
.tauthor{display:flex;align-items:center;gap:var(--sp-3)}
.tavatar{
  width:40px;height:40px;border-radius:50%;
  background:var(--forest-lt);color:#fff;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.tname{font-size:var(--t-sm);font-weight:700;color:#fff}
.tloc{font-size:var(--t-xs);color:rgba(255,255,255,.45);margin-top:2px}
.trust-stats{
  background:var(--bg-warm);border:var(--bdr);border-radius:var(--r-lg);
  display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden;
}
.ts{padding:var(--sp-5);text-align:center;border-right:var(--bdr)}
.ts:last-child{border-right:none}
.ts-val{font-size:var(--t-2xl);font-weight:800;color:var(--ink-900);letter-spacing:-0.03em;line-height:1;margin-bottom:4px}
.ts-lbl{font-size:var(--t-xs);color:var(--ink-400);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* ── FORM ──────────────────────────────────────────────────────────────── */
.form-sec{background:var(--bg-cool);border-top:var(--bdr)}
.form-layout{
  display:grid;gap:var(--sp-8);grid-template-columns:1fr;
  margin-top:var(--sp-10);
}
@media(min-width:900px){.form-layout{grid-template-columns:360px 1fr;gap:var(--sp-12);align-items:start}}
.aside-title{font-size:var(--t-xl);font-weight:800;color:var(--ink-900);letter-spacing:-0.025em;margin-bottom:var(--sp-3)}
.aside-body{font-size:var(--t-sm);color:var(--ink-500);line-height:1.75;margin-bottom:var(--sp-5)}
.csb{background:#fff;border:var(--bdr);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-xs)}
.csb-hdr{
  padding:13px 18px;background:var(--forest);
  display:flex;justify-content:space-between;align-items:center;
}
.csb-t{font-size:var(--t-xs);font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.csb-c{font-size:var(--t-xs);color:rgba(255,255,255,.35)}
.csb-empty{padding:var(--sp-8) var(--sp-5);text-align:center;color:var(--ink-400);font-size:var(--t-sm)}
.csb-row{
  padding:12px 18px;border-bottom:var(--bdr);
  display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);
}
.csb-row:last-of-type{border-bottom:none}
.csb-rn{font-size:var(--t-sm);font-weight:700;color:var(--ink-900);letter-spacing:-0.01em}
.csb-rq{font-size:var(--t-xs);color:var(--ink-400)}
.csb-rt{font-size:var(--t-base);font-weight:800;color:var(--ink-900);letter-spacing:-0.02em;white-space:nowrap}
.csb-total{
  padding:13px 18px;background:var(--bg-accent);border-top:var(--bdr-sage);
  display:flex;justify-content:space-between;align-items:center;
}
.csb-tl{font-size:var(--t-sm);font-weight:700;color:var(--ink-700)}
.csb-tv{font-size:var(--t-xl);font-weight:800;color:var(--ink-900);letter-spacing:-0.025em}
.aside-note{font-size:var(--t-xs);color:var(--ink-400);margin-top:var(--sp-3);line-height:1.6}

/* FORM CARD */
.fcard{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  padding:clamp(24px,4vw,44px);
  box-shadow:var(--sh-sm);
}
.fcard-title{
  font-size:var(--t-xl);font-weight:800;color:var(--ink-900);
  letter-spacing:-0.025em;margin-bottom:var(--sp-6);
  padding-bottom:var(--sp-5);border-bottom:var(--bdr);
}
.fg{margin-bottom:var(--sp-5)}
.flbl{
  display:block;font-size:var(--t-xs);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-600);margin-bottom:6px;
}
.req{color:var(--red)}
.fi,.fsel,.fta{
  width:100%;height:44px;padding:0 13px;
  border:1.5px solid var(--ink-200);border-radius:var(--r);
  font-size:var(--t-sm);color:var(--ink-900);background:#fff;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.fi:focus,.fsel:focus,.fta:focus{
  border-color:var(--forest);
  box-shadow:0 0 0 3px rgba(26,71,49,.1);
}
.fi.err,.fsel.err{border-color:var(--red)}
.fta{height:auto;padding:12px 13px;resize:vertical;min-height:88px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
@media(max-width:480px){.frow{grid-template-columns:1fr}}
.fhint{font-size:var(--t-xs);color:var(--ink-400);margin-top:5px;line-height:1.55}
.ferr{font-size:var(--t-xs);color:var(--red);margin-top:4px;font-weight:500}
.priv{
  display:flex;gap:var(--sp-3);align-items:flex-start;
  background:var(--bg-accent);border:1px solid var(--bdr-sage);
  border-radius:var(--r);padding:var(--sp-4);
  margin-bottom:var(--sp-5);
  font-size:var(--t-xs);color:var(--ink-600);line-height:1.65;
}
.serr{
  background:var(--red-pale);border:1px solid #fecaca;
  border-radius:var(--r);padding:var(--sp-3) var(--sp-4);
  font-size:var(--t-sm);color:var(--red);margin-bottom:var(--sp-4);
}
.sub-btn{
  width:100%;height:52px;padding:0 var(--sp-6);
  background:var(--forest);color:#fff;
  border-radius:var(--r);font-size:var(--t-base);font-weight:700;
  letter-spacing:.01em;border:none;cursor:pointer;
  transition:background .15s,transform .15s,box-shadow .15s;
  box-shadow:0 2px 8px rgba(26,71,49,.25);
}
.sub-btn:hover:not(:disabled){background:var(--forest-mid);transform:translateY(-1px);box-shadow:0 4px 16px rgba(26,71,49,.3)}
.sub-btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.success{text-align:center;padding:var(--sp-12) var(--sp-6)}
.success-ico{
  width:64px;height:64px;
  background:var(--bg-accent);border:1.5px solid var(--bdr-sage);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin:0 auto var(--sp-5);font-size:1.6rem;
}
.success-h{font-size:var(--t-2xl);font-weight:800;color:var(--ink-900);letter-spacing:-0.025em;margin-bottom:var(--sp-3)}
.success-p{font-size:var(--t-sm);color:var(--ink-500);line-height:1.75;max-width:380px;margin:0 auto}

/* ── CART DRAWER ───────────────────────────────────────────────────────── */
.cov{
  position:fixed;inset:0;background:rgba(13,28,20,.4);
  z-index:400;opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.cov.open{opacity:1;pointer-events:auto}
.csid{
  position:fixed;top:0;right:0;bottom:0;
  width:min(420px,100vw);
  background:#fff;z-index:401;
  transform:translateX(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--sh-xl);
  display:flex;flex-direction:column;
  border-left:var(--bdr);
}
.csid.open{transform:translateX(0)}
@media(max-width:480px){
  .csid{
    top:auto;width:100%;height:92dvh;
    transform:translateY(100%);
    border-left:none;border-top:var(--bdr);
    border-radius:var(--r-xl) var(--r-xl) 0 0;
  }
  .csid.open{transform:translateY(0)}
}
.cs-hdr{
  padding:18px 20px;
  background:var(--forest);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.cs-title{font-size:var(--t-lg);font-weight:800;color:#fff;letter-spacing:-0.02em}
.cs-close{
  color:rgba(255,255,255,.65);padding:6px;border-radius:var(--r-sm);
  background:none;border:none;cursor:pointer;display:flex;
  transition:color .15s;min-height:44px;min-width:44px;
  align-items:center;justify-content:center;
}
.cs-close:hover{color:#fff}
.cs-items{flex:1;overflow-y:auto;padding:var(--sp-4);-webkit-overflow-scrolling:touch}
.cs-empty{
  height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;color:var(--ink-400);gap:var(--sp-3);
  padding:var(--sp-8);
}
.cs-empty-ico{font-size:2.5rem;opacity:.25}
.ci{border:var(--bdr);border-radius:var(--r-md);padding:var(--sp-4);margin-bottom:var(--sp-3)}
.ci-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:var(--sp-3);gap:var(--sp-2)}
.ci-name{font-size:var(--t-sm);font-weight:700;color:var(--ink-900);letter-spacing:-0.01em;line-height:1.35}
.ci-unit{font-size:var(--t-xs);color:var(--ink-400);margin-top:2px}
.ci-rm{
  color:var(--ink-300);padding:4px;border-radius:var(--r-sm);
  background:none;border:none;cursor:pointer;display:flex;
  transition:color .15s;flex-shrink:0;
  min-height:32px;min-width:32px;align-items:center;justify-content:center;
}
.ci-rm:hover{color:var(--red)}
.ci-ctl{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.qc{display:flex;align-items:center;gap:var(--sp-2)}
.qb{
  width:36px;height:36px;border:1.5px solid var(--ink-200);
  border-radius:var(--r-sm);background:#fff;color:var(--ink-700);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;font-size:1rem;
}
.qb:hover{border-color:var(--forest);color:var(--forest);background:var(--bg-accent)}
.qb:active{transform:scale(.95)}
.qv{min-width:32px;text-align:center;font-weight:700;font-size:var(--t-sm)}
.ci-line{font-size:var(--t-base);font-weight:800;color:var(--ink-900);letter-spacing:-0.02em;white-space:nowrap}
.cs-ft{padding:var(--sp-4) var(--sp-5);border-top:var(--bdr);background:#fff;flex-shrink:0}
.cs-sub-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.cs-sub-lbl{font-size:var(--t-sm);font-weight:600;color:var(--ink-600)}
.cs-sub-val{font-size:var(--t-2xl);font-weight:800;color:var(--ink-900);letter-spacing:-0.03em}
.cs-note{font-size:var(--t-xs);color:var(--ink-400);margin-bottom:var(--sp-4);line-height:1.55}
.cs-btns{display:flex;flex-direction:column;gap:var(--sp-2)}
.bfin{
  width:100%;height:52px;
  background:var(--forest);color:#fff;
  border-radius:var(--r);font-size:var(--t-base);font-weight:700;
  border:none;cursor:pointer;
  transition:background .15s,transform .15s;
  box-shadow:0 2px 8px rgba(26,71,49,.2);
}
.bfin:hover{background:var(--forest-mid);transform:translateY(-1px)}
.bclr{
  width:100%;height:40px;
  color:var(--ink-400);border:1.5px solid var(--ink-200);
  border-radius:var(--r-sm);font-size:var(--t-xs);font-weight:600;
  background:none;cursor:pointer;transition:all .15s;
}
.bclr:hover{color:var(--red);border-color:#fecaca;background:var(--red-pale)}

/* ── TOAST ─────────────────────────────────────────────────────────────── */
.toast{
  position:fixed;bottom:clamp(16px,3vw,28px);left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--ink-900);color:#fff;
  padding:11px 20px;border-radius:var(--r);
  font-size:var(--t-xs);font-weight:700;letter-spacing:.04em;
  z-index:500;transition:transform .25s cubic-bezier(.4,0,.2,1);
  pointer-events:none;white-space:nowrap;
  box-shadow:var(--sh-lg);
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── WHATSAPP ───────────────────────────────────────────────────────────── */
.wa-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:#25d366;color:#fff;
  font-size:var(--t-sm);font-weight:700;
  padding:12px 20px;border-radius:var(--r);
  text-decoration:none;
  transition:background .15s,transform .15s;
  min-height:48px;letter-spacing:.01em;
}
.wa-btn:hover{background:#1ebe5d;transform:translateY(-1px)}
.wa-inline{
  display:inline-flex;align-items:center;gap:6px;
  color:#25d366;font-size:var(--t-sm);font-weight:700;
  text-decoration:none;transition:opacity .15s;
}
.wa-inline:hover{opacity:.8}
.direct-contact{
  margin-top:var(--sp-5);
  padding:var(--sp-5);
  background:var(--bg-accent);
  border:1.5px solid #c8ddd0;
  border-radius:var(--r-lg);
}
.dc-label{
  font-size:var(--t-xs);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-500);margin-bottom:var(--sp-2);
}
.dc-body{font-size:var(--t-sm);color:var(--ink-600);line-height:1.65;margin-bottom:var(--sp-4)}

/* ── FOOTER ────────────────────────────────────────────────────────────── */
.footer{
  background:var(--bg-warm);border-top:var(--bdr);
  padding:var(--sp-12) 0 var(--sp-8);
}
.footer-in{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
.footer-top{
  display:grid;grid-template-columns:1fr;
  gap:var(--sp-8);padding-bottom:var(--sp-8);
  border-bottom:var(--bdr);margin-bottom:var(--sp-6);
}
@media(min-width:600px){.footer-top{grid-template-columns:1.5fr 1fr 1fr 1fr}}
.footer-brand-name{font-size:var(--t-lg);font-weight:800;color:var(--ink-900);letter-spacing:-0.025em;margin-bottom:var(--sp-3)}
.footer-desc{font-size:var(--t-sm);color:var(--ink-500);line-height:1.7;max-width:280px}
.fcol-label{font-size:var(--t-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-400);margin-bottom:var(--sp-4)}
.flinks{display:flex;flex-direction:column;gap:var(--sp-3)}
.flink{font-size:var(--t-sm);color:var(--ink-500);background:none;border:none;cursor:pointer;text-align:left;padding:0;transition:color .15s}
.flink:hover{color:var(--ink-900)}
.footer-bot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:var(--sp-3)}
.footer-legal{font-size:var(--t-xs);color:var(--ink-400);letter-spacing:.01em}

/* ── PRICE CHANGE INDICATORS ───────────────────────────────────────────── */
.pdelta{
  display:inline-flex;align-items:center;gap:2px;
  font-size:.65rem;font-weight:700;letter-spacing:.02em;
  padding:1px 5px;border-radius:3px;margin-left:5px;
  vertical-align:middle;white-space:nowrap;
}
.pdelta.up{background:#fef2f2;color:#b91c1c}
.pdelta.dn{background:#f0fdf4;color:#166534}
.pdelta.nc{background:var(--ink-100);color:var(--ink-400)}

/* ── BUILD COST ESTIMATOR ──────────────────────────────────────────────── */
.est-sec{background:var(--bg-cool);border-top:var(--bdr)}
.est-grid{
  display:grid;grid-template-columns:1fr;
  gap:var(--sp-6);margin-top:var(--sp-8);
}
@media(min-width:900px){.est-grid{grid-template-columns:380px 1fr;gap:var(--sp-10);align-items:start}}
.est-form-card{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  padding:var(--sp-6);box-shadow:var(--sh-sm);
}
.est-form-title{
  font-size:var(--t-lg);font-weight:800;color:var(--ink-900);
  letter-spacing:-0.025em;margin-bottom:var(--sp-5);
  padding-bottom:var(--sp-4);border-bottom:var(--bdr);
}
.est-field{margin-bottom:var(--sp-4)}
.est-label{
  display:block;font-size:var(--t-xs);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-600);margin-bottom:6px;
}
.est-select,.est-input{
  width:100%;height:44px;padding:0 13px;
  border:1.5px solid var(--ink-200);border-radius:var(--r);
  font-size:var(--t-sm);color:var(--ink-900);background:#fff;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.est-select:focus,.est-input:focus{
  border-color:var(--forest);
  box-shadow:0 0 0 3px rgba(26,71,49,.1);
}
.est-btn{
  width:100%;height:48px;
  background:var(--forest);color:#fff;
  border-radius:var(--r);font-size:var(--t-sm);font-weight:700;
  border:none;cursor:pointer;
  transition:background .15s;margin-top:var(--sp-2);
}
.est-btn:hover{background:var(--forest-mid)}
.est-note{font-size:var(--t-xs);color:var(--ink-400);margin-top:var(--sp-3);line-height:1.6}
.est-results{display:flex;flex-direction:column;gap:var(--sp-4)}
.est-summary{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  overflow:hidden;box-shadow:var(--sh-sm);
}
.est-sum-hdr{
  background:var(--forest);padding:16px 20px;
  display:flex;justify-content:space-between;align-items:center;
}
.est-sum-title{font-size:var(--t-sm);font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.04em;text-transform:uppercase}
.est-sum-sub{font-size:var(--t-xs);color:rgba(255,255,255,.5)}
.est-sum-row{
  padding:13px 20px;border-bottom:var(--bdr);
  display:grid;grid-template-columns:1fr auto auto;
  gap:var(--sp-4);align-items:center;
}
.est-sum-row:last-of-type{border-bottom:none}
.est-sum-name{font-size:var(--t-sm);font-weight:600;color:var(--ink-900)}
.est-sum-qty{font-size:var(--t-xs);color:var(--ink-400);text-align:right;white-space:nowrap}
.est-sum-price{font-size:var(--t-sm);font-weight:700;color:var(--ink-900);text-align:right;white-space:nowrap;min-width:80px}
.est-total-row{
  padding:16px 20px;background:var(--bg-accent);
  border-top:2px solid #c8ddd0;
  display:flex;justify-content:space-between;align-items:center;
}
.est-total-lbl{font-size:var(--t-base);font-weight:700;color:var(--ink-700)}
.est-total-val{font-size:var(--t-2xl);font-weight:800;color:var(--ink-900);letter-spacing:-0.03em}
.est-disclaimer{
  background:var(--bg-warm);border:var(--bdr);border-radius:var(--r-lg);
  padding:var(--sp-4) var(--sp-5);
  font-size:var(--t-xs);color:var(--ink-500);line-height:1.65;
}
.est-add-btn{
  width:100%;height:48px;
  background:var(--bg);color:var(--forest);
  border:1.5px solid var(--forest);
  border-radius:var(--r);font-size:var(--t-sm);font-weight:700;
  cursor:pointer;transition:all .15s;
}
.est-add-btn:hover{background:var(--bg-accent)}
.est-placeholder{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  padding:var(--sp-12);text-align:center;color:var(--ink-400);
  box-shadow:var(--sh-sm);
}
.est-placeholder-icon{font-size:2.5rem;margin-bottom:var(--sp-4);opacity:.3}

/* ── SAVED PROJECTS ────────────────────────────────────────────────────── */
.proj-sec{background:var(--bg-warm);border-top:var(--bdr)}
.proj-grid{
  display:grid;grid-template-columns:1fr;gap:var(--sp-4);
  margin-top:var(--sp-8);
}
@media(min-width:600px){.proj-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.proj-grid{grid-template-columns:repeat(3,1fr)}}
.proj-card{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  padding:var(--sp-5);
  display:flex;flex-direction:column;gap:var(--sp-3);
  box-shadow:var(--sh-xs);
}
.proj-card-name{font-size:var(--t-base);font-weight:800;color:var(--ink-900);letter-spacing:-0.02em}
.proj-card-meta{font-size:var(--t-xs);color:var(--ink-400)}
.proj-card-total{font-size:var(--t-xl);font-weight:800;color:var(--forest);letter-spacing:-0.025em}
.proj-card-actions{display:flex;gap:var(--sp-2);margin-top:auto}
.proj-btn{
  flex:1;height:36px;border-radius:var(--r-sm);
  font-size:var(--t-xs);font-weight:700;cursor:pointer;transition:all .15s;
}
.proj-btn-load{background:var(--forest);color:#fff;border:none}
.proj-btn-load:hover{background:var(--forest-mid)}
.proj-btn-del{background:none;color:var(--ink-400);border:1.5px solid var(--ink-200)}
.proj-btn-del:hover{color:var(--red);border-color:#fecaca;background:var(--red-pale)}
.proj-new{
  background:#fff;border:1.5px dashed var(--ink-300);border-radius:var(--r-lg);
  padding:var(--sp-5);
  display:flex;flex-direction:column;gap:var(--sp-3);
  align-items:flex-start;
}
.proj-new-label{font-size:var(--t-sm);font-weight:700;color:var(--ink-700);letter-spacing:-0.01em}
.proj-new-input{
  width:100%;height:44px;padding:0 12px;
  border:1.5px solid var(--ink-200);border-radius:var(--r);
  font-size:var(--t-sm);color:var(--ink-900);background:#fff;outline:none;
  transition:border-color .15s;
}
.proj-new-input:focus{border-color:var(--forest)}
.proj-save-btn{
  height:40px;padding:0 18px;
  background:var(--forest);color:#fff;
  border-radius:var(--r);font-size:var(--t-xs);font-weight:700;
  border:none;cursor:pointer;transition:background .15s;
}
.proj-save-btn:hover{background:var(--forest-mid)}
.proj-save-btn:disabled{opacity:.4;cursor:not-allowed}
.proj-empty{
  grid-column:1/-1;
  text-align:center;padding:var(--sp-10);
  color:var(--ink-400);font-size:var(--t-sm);
}

/* ── FAQ / BUILDING GUIDE ──────────────────────────────────────────────── */
.faq-sec{background:var(--bg)}
.faq-layout{
  display:grid;grid-template-columns:1fr;gap:var(--sp-10);
  margin-top:var(--sp-8);
}
@media(min-width:900px){.faq-layout{grid-template-columns:280px 1fr;gap:var(--sp-12);align-items:start}}
.faq-cats{display:flex;flex-direction:column;gap:var(--sp-1)}
@media(max-width:899px){.faq-cats{flex-direction:row;flex-wrap:wrap;gap:var(--sp-2)}}
.faq-cat-btn{
  padding:9px 14px;border-radius:var(--r);
  font-size:var(--t-sm);font-weight:600;
  color:var(--ink-500);background:none;
  border:none;cursor:pointer;text-align:left;
  transition:all .15s;
}
.faq-cat-btn:hover{background:var(--ink-100);color:var(--ink-900)}
.faq-cat-btn.on{background:var(--bg-accent);color:var(--forest)}
.faq-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.faq-item{
  background:#fff;border:var(--bdr);border-radius:var(--r-lg);
  overflow:hidden;transition:box-shadow .15s;
}
.faq-item.open{box-shadow:var(--sh-sm)}
.faq-q{
  width:100%;padding:var(--sp-5) var(--sp-6);
  display:flex;justify-content:space-between;align-items:center;gap:var(--sp-4);
  background:none;border:none;cursor:pointer;text-align:left;
  transition:background .15s;
}
.faq-q:hover{background:var(--bg-warm)}
.faq-q-text{font-size:var(--t-base);font-weight:700;color:var(--ink-900);letter-spacing:-0.01em;line-height:1.4}
.faq-chevron{
  flex-shrink:0;color:var(--ink-400);
  transition:transform .25s;
}
.faq-item.open .faq-chevron{transform:rotate(180deg);color:var(--forest)}
.faq-a{
  padding:0 var(--sp-6) var(--sp-5);
  font-size:var(--t-sm);color:var(--ink-600);line-height:1.8;
  border-top:var(--bdr);padding-top:var(--sp-4);
}
.faq-a p{margin-bottom:var(--sp-3)}
.faq-a p:last-child{margin-bottom:0}
.faq-a ul{margin:var(--sp-2) 0 var(--sp-3) var(--sp-5);display:flex;flex-direction:column;gap:5px}
.faq-a li{font-size:var(--t-sm);color:var(--ink-600)}
.faq-a strong{color:var(--ink-800);font-weight:700}

/* ── PRICE UPDATE BANNER ──────────────────────────────────────────────── */
.price-banner{
  background:var(--bg-accent);border-bottom:1.5px solid #c8ddd0;
  padding:10px var(--gutter);
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.price-banner-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.price-banner-dot{width:8px;height:8px;background:var(--forest-lt);border-radius:50%;flex-shrink:0;animation:pulse 2.5s ease-in-out infinite}
.price-banner-text{font-size:var(--t-xs);color:var(--ink-700);font-weight:500}
.price-banner-text strong{font-weight:700;color:var(--forest)}
.price-banner-dismiss{font-size:var(--t-xs);color:var(--ink-400);background:none;border:none;cursor:pointer;padding:2px 8px;border-radius:var(--r-sm);transition:color .15s}
.price-banner-dismiss:hover{color:var(--ink-700)}

/* ── SEASONAL WARNING ─────────────────────────────────────────────────── */
.season-banner{
  background:#fef3c7;border:1px solid #f6d860;border-radius:var(--r);
  padding:var(--sp-4) var(--sp-5);
  display:flex;gap:var(--sp-3);align-items:flex-start;
  margin-bottom:var(--sp-5);font-size:var(--t-sm);color:#78350f;line-height:1.6;
}
.season-banner-close{margin-left:auto;font-size:var(--t-xs);color:#92400e;background:none;border:1px solid #f6d860;cursor:pointer;flex-shrink:0;padding:2px 10px;border-radius:var(--r-sm);transition:background .15s}
.season-banner-close:hover{background:rgba(0,0,0,.05)}

/* ── REMITTANCE CALCULATOR ────────────────────────────────────────────── */
.remit-sec{background:var(--bg-warm);border-top:var(--bdr)}
.remit-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-6);margin-top:var(--sp-8)}
@media(min-width:900px){.remit-grid{grid-template-columns:1fr 1fr;gap:var(--sp-10);align-items:start}}
.remit-card{background:#fff;border:var(--bdr);border-radius:var(--r-lg);padding:var(--sp-6);box-shadow:var(--sh-sm)}
.remit-card-title{font-size:var(--t-lg);font-weight:800;color:var(--ink-900);letter-spacing:-0.025em;margin-bottom:var(--sp-5);padding-bottom:var(--sp-4);border-bottom:var(--bdr)}
.remit-field{margin-bottom:var(--sp-4)}
.remit-label{display:block;font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-600);margin-bottom:6px}
.remit-input-wrap{position:relative}
.remit-prefix{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:var(--t-base);font-weight:700;color:var(--ink-400);pointer-events:none}
.remit-input{width:100%;height:52px;padding:0 13px 0 32px;border:1.5px solid var(--ink-200);border-radius:var(--r);font-size:var(--t-xl);font-weight:800;color:var(--ink-900);background:#fff;outline:none;letter-spacing:-0.02em;transition:border-color .15s,box-shadow .15s}
.remit-input:focus{border-color:var(--forest);box-shadow:0 0 0 3px rgba(26,71,49,.1)}
.remit-select{width:100%;height:44px;padding:0 13px;border:1.5px solid var(--ink-200);border-radius:var(--r);font-size:var(--t-sm);color:var(--ink-900);background:#fff;outline:none;transition:border-color .15s}
.remit-select:focus{border-color:var(--forest)}
.remit-result{background:var(--bg-accent);border:1.5px solid #c8ddd0;border-radius:var(--r-lg);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3)}
.remit-result-row{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:var(--sp-3);border-bottom:var(--bdr)}
.remit-result-row:last-child{border-bottom:none;padding-bottom:0}
.remit-result-lbl{font-size:var(--t-sm);color:var(--ink-600)}
.remit-result-val{font-size:var(--t-base);font-weight:800;color:var(--ink-900);letter-spacing:-0.02em}
.remit-result-val.big{font-size:var(--t-2xl);color:var(--forest);letter-spacing:-0.03em}
.remit-prov-title{font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-500);margin-bottom:var(--sp-3);margin-top:var(--sp-5)}
.remit-prov{display:flex;justify-content:space-between;align-items:center;padding:var(--sp-4);background:#fff;border:var(--bdr);border-radius:var(--r-md);margin-bottom:var(--sp-2)}
.remit-prov-name{font-size:var(--t-sm);font-weight:700;color:var(--ink-900)}
.remit-prov-detail{font-size:var(--t-xs);color:var(--ink-500)}
.remit-prov-rate{font-size:var(--t-sm);font-weight:800;color:var(--forest)}
.remit-note{font-size:var(--t-xs);color:var(--ink-400);margin-top:var(--sp-4);line-height:1.6}

/* ── QUANTITY CALCULATORS ─────────────────────────────────────────────── */
.calc-sec{background:var(--bg);border-top:var(--bdr)}
.calc-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp-8);margin-bottom:var(--sp-5)}
.calc-tab{padding:8px 16px;border-radius:100px;font-size:var(--t-xs);font-weight:700;border:1.5px solid var(--ink-200);color:var(--ink-500);background:#fff;cursor:pointer;transition:all .15s}
.calc-tab:hover{border-color:var(--ink-400);color:var(--ink-800)}
.calc-tab.on{background:var(--forest);border-color:var(--forest);color:#fff}
.calc-card{background:#fff;border:var(--bdr);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-sm)}
.calc-card-hdr{padding:18px var(--sp-6);background:var(--bg-cool);border-bottom:var(--bdr)}
.calc-card-title{font-size:var(--t-base);font-weight:800;color:var(--ink-900);letter-spacing:-0.02em;margin-bottom:3px}
.calc-card-sub{font-size:var(--t-xs);color:var(--ink-500)}
.calc-body{padding:var(--sp-6)}
.calc-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--sp-4);margin-bottom:var(--sp-5)}
.calc-field label{display:block;font-size:var(--t-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-600);margin-bottom:6px}
.calc-field input,.calc-field select{width:100%;height:44px;padding:0 12px;border:1.5px solid var(--ink-200);border-radius:var(--r);font-size:var(--t-base);font-weight:700;color:var(--ink-900);background:#fff;outline:none;transition:border-color .15s}
.calc-field input:focus,.calc-field select:focus{border-color:var(--forest)}
.calc-results{background:var(--bg-accent);border:1.5px solid #c8ddd0;border-radius:var(--r-lg);padding:var(--sp-5);display:flex;flex-direction:column;gap:var(--sp-3)}
.calc-result-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:var(--sp-3);border-bottom:var(--bdr)}
.calc-result-row:last-child{border-bottom:none;padding-bottom:0}
.calc-result-lbl{font-size:var(--t-sm);color:var(--ink-700)}
.calc-result-val{font-size:var(--t-lg);font-weight:800;color:var(--ink-900);letter-spacing:-0.02em}
.calc-result-val.hero{font-size:var(--t-2xl);color:var(--forest)}
.calc-formula{font-size:var(--t-xs);color:var(--ink-400);margin-top:var(--sp-4);line-height:1.6;font-style:italic}

/* ── WHAT HAPPENS NEXT ────────────────────────────────────────────────── */
.next-sec{background:var(--bg-cool);border-top:var(--bdr)}
.next-steps{display:flex;flex-direction:column;gap:0;margin-top:var(--sp-8);border:var(--bdr);border-radius:var(--r-lg);overflow:hidden;background:#fff;box-shadow:var(--sh-sm)}
.next-step{display:flex;gap:var(--sp-5);align-items:flex-start;padding:var(--sp-5) var(--sp-6);border-bottom:var(--bdr)}
.next-step:last-child{border-bottom:none}
.next-num{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:var(--t-xs);font-weight:800;margin-top:4px}
.next-num.done{background:#dcfce7;color:#166534}
.next-num.active{background:var(--forest);color:#fff;box-shadow:0 0 0 4px var(--bg-accent)}
.next-num.wait{background:var(--ink-100);color:var(--ink-400)}
.next-content{flex:1}
.next-title{font-size:var(--t-base);font-weight:700;color:var(--ink-900);letter-spacing:-0.01em;margin-bottom:4px}
.next-body{font-size:var(--t-sm);color:var(--ink-500);line-height:1.65}
.next-time{display:inline-block;margin-top:var(--sp-3);font-size:var(--t-xs);font-weight:700;color:var(--forest);background:var(--bg-accent);border:1px solid #c8ddd0;padding:3px 10px;border-radius:100px}

/* ── COMPARISON ───────────────────────────────────────────────────────── */
.compare-sec{background:var(--bg-warm);border-top:var(--bdr)}
.compare-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp-8);margin-bottom:var(--sp-5)}
.compare-tab{padding:8px 18px;border-radius:100px;font-size:var(--t-xs);font-weight:700;border:1.5px solid var(--ink-200);color:var(--ink-500);background:#fff;cursor:pointer;transition:all .15s}
.compare-tab:hover{border-color:var(--ink-400);color:var(--ink-800)}
.compare-tab.on{background:var(--forest);border-color:var(--forest);color:#fff}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
@media(max-width:600px){.compare-grid{grid-template-columns:1fr}}
.compare-col{background:#fff;border:var(--bdr);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-xs)}
.compare-hdr{padding:16px var(--sp-5);border-bottom:var(--bdr)}
.compare-hdr.best{background:var(--bg-accent);border-bottom:2px solid #c8ddd0}
.compare-hdr-name{font-size:var(--t-base);font-weight:800;color:var(--ink-900);letter-spacing:-0.02em;margin-bottom:3px}
.compare-best-tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:700;color:var(--forest)}
.compare-rows{display:flex;flex-direction:column}
.compare-row{padding:12px var(--sp-5);border-bottom:var(--bdr);display:flex;flex-direction:column;gap:3px}
.compare-row:last-child{border-bottom:none}
.compare-row-lbl{font-size:var(--t-xs);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-400)}
.compare-row-val{font-size:var(--t-sm);font-weight:600;color:var(--ink-900);line-height:1.45}
.compare-footnote{font-size:var(--t-xs);color:var(--ink-400);margin-top:var(--sp-4);line-height:1.6;font-style:italic;text-align:center}

/* ── PRINT ────────────────────────────────────────────────────────────── */
.print-quote{display:none}
@media print{
  .hdr,.cart-btn,.hbg,.nav,.add-btn,.mc-add,.hero,.how-sec,.trust-sec,
  .est-sec,.faq-sec,.remit-sec,.calc-sec,.compare-sec,.next-sec,.proj-sec,
  .form-sec,.footer,.price-banner,.season-banner,.cov,.csid,.toast,
  .mob-nav{display:none!important}
  .print-quote{display:block!important}
  body{font-size:11pt;color:#000;font-family:Arial,sans-serif}
  .pq-header{margin-bottom:20pt}
  .pq-brand{font-size:18pt;font-weight:700;margin-bottom:4pt}
  .pq-meta{font-size:9pt;color:#555}
  .pq-table{width:100%;border-collapse:collapse;margin:14pt 0}
  .pq-table th{background:#f0f0f0;padding:7pt 10pt;font-size:8pt;text-align:left;border:1pt solid #ccc;text-transform:uppercase;letter-spacing:.05em}
  .pq-table td{padding:7pt 10pt;border:1pt solid #ddd;font-size:9pt}
  .pq-total{font-size:13pt;font-weight:700;text-align:right;margin-top:10pt;padding-top:6pt;border-top:2pt solid #000}
  .pq-footer{margin-top:20pt;font-size:8pt;color:#888;border-top:1pt solid #ddd;padding-top:6pt}
}

/* ── SHOW MORE / EXPAND TOGGLE ───────────────────────────────────────── */
.expand-toggle{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:var(--sp-4) var(--sp-5);
  background:var(--bg-warm);border:var(--bdr);border-radius:var(--r-lg);
  font-size:var(--t-sm);font-weight:700;color:var(--forest);
  cursor:pointer;transition:all .15s;margin-top:var(--sp-4);
}
.expand-toggle:hover{background:var(--bg-accent);border-color:#c8ddd0}
.expand-chevron{transition:transform .25s}
.expand-chevron.open{transform:rotate(180deg)}

/* ── TABBED TOOLS SECTION ────────────────────────────────────────────── */
.tools-sec{background:var(--bg-cool);border-top:var(--bdr)}
.tools-tabs{
  display:flex;gap:0;margin-top:var(--sp-8);margin-bottom:0;
  border:var(--bdr);border-radius:var(--r-lg) var(--r-lg) 0 0;
  overflow:hidden;background:#fff;flex-wrap:wrap;
}
.tools-tab{
  flex:1;min-width:120px;padding:var(--sp-4) var(--sp-3);
  font-size:var(--t-xs);font-weight:700;letter-spacing:.02em;
  color:var(--ink-400);background:var(--bg-cool);
  border:none;border-right:var(--bdr);border-bottom:var(--bdr);
  cursor:pointer;transition:all .15s;text-align:center;
  white-space:nowrap;
}
.tools-tab:last-child{border-right:none}
.tools-tab:hover{color:var(--ink-700);background:var(--bg-warm)}
.tools-tab.on{background:#fff;color:var(--forest);border-bottom:2px solid var(--forest);font-weight:800}
.tools-panel{
  background:#fff;border:var(--bdr);border-top:none;
  border-radius:0 0 var(--r-lg) var(--r-lg);
  padding:var(--sp-6);box-shadow:var(--sh-sm);
}
@media(max-width:600px){
  .tools-tab{font-size:.65rem;padding:var(--sp-3) var(--sp-2);min-width:80px}
}

/* ── COMPACT TRUST + HOW ─────────────────────────────────────────────── */
.trust-how-sec{background:var(--bg-warm);border-top:var(--bdr)}
.th-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-10);margin-top:var(--sp-8)}
@media(min-width:900px){.th-grid{grid-template-columns:1fr 1fr;gap:var(--sp-12);align-items:start}}
.how-steps-compact{display:flex;flex-direction:column;gap:0}
.how-step-c{
  display:flex;gap:var(--sp-4);align-items:flex-start;
  padding:var(--sp-4) 0;border-bottom:var(--bdr);
}
.how-step-c:last-child{border-bottom:none}
.how-step-c-num{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:var(--forest);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:var(--t-xs);font-weight:800;margin-top:2px;
}
.how-step-c h3{font-size:var(--t-sm);font-weight:700;color:var(--ink-900);margin-bottom:3px;letter-spacing:-0.01em}
.how-step-c p{font-size:var(--t-xs);color:var(--ink-500);line-height:1.6}
.trust-points{display:flex;flex-direction:column;gap:0}
.trust-point{
  display:flex;gap:var(--sp-3);align-items:flex-start;
  padding:var(--sp-4) 0;border-bottom:var(--bdr);
}
.trust-point:last-child{border-bottom:none}
.trust-point-icon{color:var(--forest);flex-shrink:0;margin-top:2px}
.trust-point h4{font-size:var(--t-sm);font-weight:700;color:var(--ink-900);margin-bottom:2px}
.trust-point p{font-size:var(--t-xs);color:var(--ink-500);line-height:1.6}
.testimonial-compact{
  background:var(--forest);border-radius:var(--r-lg);
  padding:var(--sp-5) var(--sp-6);margin-top:var(--sp-5);
}
.tq-compact{font-size:var(--t-sm);color:rgba(255,255,255,.82);line-height:1.75;font-style:italic;margin-bottom:var(--sp-4)}

/* ── COMPACT TIMELINE STRIP ──────────────────────────────────────────── */
.timeline-strip{
  display:flex;gap:0;margin-top:var(--sp-6);
  border:var(--bdr);border-radius:var(--r-lg);overflow:hidden;
  background:#fff;flex-wrap:wrap;
}
.ts-item{
  flex:1;min-width:120px;padding:var(--sp-4) var(--sp-3);
  border-right:var(--bdr);position:relative;
}
.ts-item:last-child{border-right:none}
.ts-item-num{
  width:24px;height:24px;border-radius:50%;
  font-size:.65rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:var(--sp-2);
}
.ts-item-num.s-done{background:#dcfce7;color:#166534}
.ts-item-num.s-now{background:var(--forest);color:#fff}
.ts-item-num.s-wait{background:var(--ink-100);color:var(--ink-400)}
.ts-item-title{font-size:var(--t-xs);font-weight:700;color:var(--ink-900);line-height:1.3;margin-bottom:2px}
.ts-item-time{font-size:.65rem;color:var(--forest);font-weight:700}

/* ── FAQ COMPACT ─────────────────────────────────────────────────────── */
.faq-show-more{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:var(--sp-4);
  background:none;border:var(--bdr);border-radius:var(--r-lg);
  font-size:var(--t-sm);font-weight:700;color:var(--ink-500);
  cursor:pointer;margin-top:var(--sp-3);transition:all .15s;
}

/* ── ABOUT SECTION ────────────────────────────────────────────────────── */
.about-sec{background:var(--bg);border-top:var(--bdr)}
.about-grid{display:grid;grid-template-columns:1fr;gap:var(--sp-10);margin-top:var(--sp-8)}
@media(min-width:900px){.about-grid{grid-template-columns:1fr 1fr;gap:var(--sp-16);align-items:start}}
.about-story p{font-size:var(--t-base);color:var(--ink-600);line-height:1.85;margin-bottom:var(--sp-4)}
.about-story p:last-child{margin-bottom:0}
.about-founder{background:var(--bg-warm);border:var(--bdr);border-radius:var(--r-lg);padding:var(--sp-6);display:flex;flex-direction:column;gap:var(--sp-4)}
.about-founder-top{display:flex;align-items:center;gap:var(--sp-4)}
.about-avatar{width:64px;height:64px;border-radius:50%;background:var(--forest);color:#fff;font-size:var(--t-xl);font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:-0.02em}
.about-founder-name{font-size:var(--t-lg);font-weight:800;color:var(--ink-900);letter-spacing:-0.025em}
.about-founder-role{font-size:var(--t-xs);color:var(--forest);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:3px}
.about-founder-bio{font-size:var(--t-sm);color:var(--ink-600);line-height:1.75}
.about-founder-contact{display:flex;gap:var(--sp-3);flex-wrap:wrap;padding-top:var(--sp-4);border-top:var(--bdr);align-items:center}

/* ── PRIVACY POLICY ───────────────────────────────────────────────────── */
.privacy-sec{background:var(--bg-cool);border-top:var(--bdr)}
.privacy-content{max-width:720px;margin-top:var(--sp-8)}
.privacy-content h3{font-size:var(--t-base);font-weight:700;color:var(--ink-900);letter-spacing:-0.01em;margin:var(--sp-6) 0 var(--sp-3)}
.privacy-content h3:first-child{margin-top:0}
.privacy-content p,.privacy-content li{font-size:var(--t-sm);color:var(--ink-600);line-height:1.8;margin-bottom:var(--sp-3)}
.privacy-content ul{margin-left:var(--sp-5);margin-bottom:var(--sp-4);display:flex;flex-direction:column;gap:5px}
.privacy-content a{color:var(--forest);font-weight:600}
.privacy-updated{display:inline-block;margin-bottom:var(--sp-5);font-size:var(--t-xs);font-weight:700;color:var(--forest);background:var(--bg-accent);border:1px solid #c8ddd0;padding:4px 12px;border-radius:100px}

/* ── MOBILE STICKY CTA ────────────────────────────────────────────────── */
.mob-sticky{display:none;position:fixed;bottom:0;left:0;right:0;z-index:150;background:#fff;border-top:var(--bdr);padding:var(--sp-3) var(--sp-4);box-shadow:0 -4px 20px rgba(13,28,20,.1)}
@media(max-width:767px){.mob-sticky{display:flex;gap:var(--sp-3);align-items:center}}
.mob-sticky-quote{flex:1;height:48px;background:var(--forest);color:#fff;border-radius:var(--r);font-size:var(--t-sm);font-weight:700;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.mob-sticky-wa{width:48px;height:48px;background:#25d366;color:#fff;border-radius:var(--r);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
@media(max-width:767px){.footer{padding-bottom:calc(var(--sp-8) + 72px)}}

const CC=createContext(null);
function CartProvider({children}){
  const[items,set]=useState([]);
  const add   =useCallback(m=>set(p=>p.find(i=>i.id===m.id)?p:[...p,{...m,qty:1}]),[]);
  const remove=useCallback(id=>set(p=>p.filter(i=>i.id!==id)),[]);
  const setQty=useCallback((id,q)=>{if(q<1)return;set(p=>p.map(i=>i.id===id?{...i,qty:q}:i));},[]);
  const clear =useCallback(()=>set([]),[]);
  const count =items.reduce((s,i)=>s+i.qty,0);
  return h(CC.Provider,{value:{items,add,remove,setQty,clear,count}},children);
}

/* ── MATERIALS ─────────────────────────────────────────────────────────── */
function Materials({currency,setCurrency}){
  const{add,items}=useCart();
  const[q,setQ]=useState("");
  const[cat,setCat]=useState("All");
  const[expanded,setExpanded]=useState(false);
  const[toast,setToast]=useState({show:false,msg:""});
  const inCart=useCallback(id=>items.some(i=>i.id===id),[items]);

  // 4 representative samples — one from each key category
  const SAMPLES=["sm01","rf01","pl06","dw03"];

  const filtered=useMemo(()=>MATS.filter(m=>{
    const lq=q.toLowerCase().trim();
    return(!lq||m.name.toLowerCase().includes(lq)||m.cat.toLowerCase().includes(lq))&&(cat==="All"||m.cat===cat);
  }),[q,cat]);

  // Show samples only when no search/filter active and not expanded
  const isFiltering=q.trim()!=""||cat!=="All";
  const displayed=isFiltering||expanded ? filtered : MATS.filter(m=>SAMPLES.includes(m.id));
  const showToggle=!isFiltering;

  function doAdd(m){
    if(inCart(m.id))return;
    add(m);
    setToast({show:true,msg:m.name+" added"});
    setTimeout(()=>setToast({show:false,msg:""}),2200);

    h('div',{className:"mc-top"},

    ),
    h('div',{className:"mc-foot"},
      h('div',null,
        h('span',{className:"vbadge",style:{fontSize:"var(--t-xs)"}},h(ICheck),"\u00a0Market price"),
        h(DeltaBadge,{delta:m.delta})

      h('button',{

        onClick:()=>doAdd(m),

        style:{maxWidth:"130px"},
      },inCart(m.id)?"\u2713\u00a0In quote":"Add to quote")
    )
  );

  const IChevron=()=>Ico([['polyline',{points:"6 9 12 15 18 9"}]],{width:16,height:16});

  return h('section',{id:"materials",className:"sec mat-sec"},
    h('div',{className:"wrap"},
      h(SeasonalBanner),
      h('div',{style:{marginBottom:"var(--sp-6)"}},
        h('div',{className:"sec-eyebrow"},"Price Directory"),
        h('h2',{className:"sec-title"},"Transparent material prices."),
        h('p',{className:"sec-sub"},"Market-rate prices from Gambian suppliers, updated every Monday. No markups, no hidden fees.")
      ),
      h('div',{className:"ctrl-bar"},
        h('div',{className:"ctrl-row"},
          h('div',{className:"srch-wrap"},
            h(ISearch),
            h('input',{
              className:"srch",type:"search",
              placeholder:"Search all 74 materials\u2026",
              value:q,onChange:e=>{setQ(e.target.value);if(!expanded)setExpanded(true);},
              "aria-label":"Search materials",
            })
          ),
          h('div',{className:"cur-tog",role:"group","aria-label":"Currency selection"},
            ...Object.keys(RATES).map(c=>h('button',{
              key:c,className:"cbtn"+(currency===c?" on":""),
              onClick:()=>setCurrency(c),"aria-pressed":currency===c,
            },SYMS[c]+"\u00a0"+c))
          )
        ),
        h('div',{className:"pills",role:"group","aria-label":"Filter by category"},
          ...CATS.map(c=>h('button',{
            key:c,className:"pill"+(cat===c?" on":""),
            onClick:()=>{setCat(c);if(!expanded)setExpanded(true);},
            "aria-pressed":cat===c,
          },c))
        ),
        isFiltering&&h('div',{className:"results-count"},filtered.length+" material"+(filtered.length!==1?"s":"")+" shown")
      ),
      displayed.length===0
        ? h('div',{className:"nores"},"No materials match your search.")

            h('div',{key:"tbl",className:"tbl-wrap"},

      )
    ),
    h('div',{className:"toast"+(toast.show?" show":""),role:"status","aria-live":"polite"},"\u2713\u00a0"+toast.msg)
  );
}

/* ── QUOTE FORM ────────────────────────────────────────────────────────── */
function QuoteForm({currency}){
  const{items,clear}=useCart();
  const[form,setForm]=useState({name:"",whatsapp:"",location:"",site:"",timeline:"",notes:""});
  const[errs,setErrs]=useState({});
  const[busy,setBusy]=useState(false);
  const[done,setDone]=useState(false);
  const[sErr,setSErr]=useState("");
  const total=items.reduce((s,i)=>s+i.gmd*i.qty,0);
  const summary=items.length===0?"No items in quote.":
    items.map(i=>`${i.name} \u00d7 ${i.qty} ${i.unit} @ ${fmt(i.gmd,currency)} = ${fmt(i.gmd*i.qty,currency)}`).join("\n")+
    "\n\nSUBTOTAL: "+fmt(total,currency)+" ("+currency+")";

  function validate(){
    const e={};
    if(!form.name.trim())    e.name="Please enter your full name";
    if(!form.whatsapp.trim())e.whatsapp="Please enter your WhatsApp number";
    if(!form.location)       e.location="Please select your location";
    if(!form.site.trim())    e.site="Please enter the delivery site";
    return e;
  }
  async function onSubmit(e){
    e.preventDefault();
    const v=validate();
    if(Object.keys(v).length){setErrs(v);return;}
    setErrs({});setBusy(true);setSErr("");
    try{
      const r=await fetch("https://formspree.io/f/mojrpvwz",{
        method:"POST",
        headers:{"Accept":"application/json","Content-Type":"application/json"},
        body:JSON.stringify({
          name:         form.name,
          whatsapp:     form.whatsapp,
          location:     form.location,
          delivery_site:form.site,
          timeline:     form.timeline||"No preference",
          notes:        form.notes||"—",
          quote_summary:summary,
          _subject:     "New Briksafe Quote Request — "+form.name,
        }),
      });
      const data=await r.json().catch(()=>({}));
      if(r.ok){
        setDone(true);clear();
      } else {
        // Formspree returns { errors: [{ field, message }] } on 422
        if(data.errors&&data.errors.length){
          const fieldErrs={};
          data.errors.forEach(err=>{
            if(err.field&&err.field!=="form")fieldErrs[err.field]=err.message;
          });

/* ── CALC PANEL (inner) ───────────────────────────────────────────────── */
function CalcPanel(){
  const[active,setActive]=useState(CALCS[0].id);
  const calc=CALCS.find(c=>c.id===active)||CALCS[0];
  const initVals=Object.fromEntries(calc.fields.map(f=>[f.id,f.def]));
  const[vals,setVals]=useState(initVals);
  function switchCalc(id){setActive(id);const nc=CALCS.find(c=>c.id===id);if(nc)setVals(Object.fromEntries(nc.fields.map(f=>[f.id,f.def])));}
  const results=useMemo(()=>{try{return calc.calc(vals);}catch{return [];};},[calc,vals]);
  return h('div',null,
    h('div',{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"var(--sp-4)"}},
      ...CALCS.map(c=>h('button',{
        key:c.id,className:"calc-tab"+(active===c.id?" on":""),
        onClick:()=>switchCalc(c.id),
        style:{borderRadius:"var(--r-sm)"},
      },c.label))
    ),
    h('div',{style:{marginBottom:"var(--sp-3)"}},
      h('div',{style:{fontWeight:700,color:"var(--ink-900)",marginBottom:"2px",fontSize:"var(--t-base)"}},calc.title),
      h('div',{style:{fontSize:"var(--t-xs)",color:"var(--ink-500)"}},calc.sub)
    ),
    h('div',{className:"calc-inputs"},
      ...calc.fields.map(f=>h('div',{key:f.id,className:"calc-field"},
        h('label',{htmlFor:"ci-"+f.id},f.label),
        f.type==="select"
          ? h('select',{id:"ci-"+f.id,value:vals[f.id]||f.def,onChange:e=>setVals(p=>({...p,[f.id]:e.target.value}))},
              ...(f.opts||[]).map(([v,l])=>h('option',{key:v,value:v},l))
            )
          : h('input',{id:"ci-"+f.id,type:"number",min:"0",step:"0.5",value:vals[f.id]||"",onChange:e=>setVals(p=>({...p,[f.id]:e.target.value}))})
      ))
    ),
    results.length>0&&h('div',{className:"calc-results"},
      ...results.map(r=>h('div',{key:r.l,className:"calc-result-row"},
        h('span',{className:"calc-result-lbl"},r.l),
        h('span',{className:"calc-result-val"+(r.hero?" hero":"")},r.v)
      ))
    ),
    h('p',{className:"calc-formula"},calc.formula)
  );
}

/* ── BUILD COST ESTIMATOR ───────────────────────────────────────────────── */
// Construction norms for The Gambia (conservative estimates)
const EST_CONFIG={
  // blocks per m² of wall (single skin 9")
  blocksPerSqmWall: 12,
  // cement bags per m³ of concrete (1:2:4 mix)
  cementPerM3: 7,
  // bags of cement per m² of slab (100mm thick)
  cementPerSqmSlab: 0.7,
  // rebar Y12 bars per m² of slab
  rebarPerSqmSlab: 1.2,
  // roof sheets (3m) per m² of roof
  sheetsPerSqmRoof: 0.38,
  // wall height m (floor to ceiling + ring beam allowance)
  wallHeight: 3.2,
  // perimeter multiplier per bedroom (rough guide)
  perimeterPerBed: { 1:24, 2:32, 3:40, 4:50 },
  // floor area per bedroom m²
  floorPerBed: { 1:45, 2:70, 3:100, 4:135 },
};

function calcEstimate(beds, storeys, roofType){
  const c=EST_CONFIG;
  const perimeter=c.perimeterPerBed[beds]||40;
  const floorArea=(c.floorPerBed[beds]||100)*storeys;
  const wallArea=perimeter*c.wallHeight*storeys;
  const roofArea=(c.floorPerBed[beds]||100)*1.15; // slight overhang

  const blocks=Math.ceil(wallArea*c.blocksPerSqmWall*1.08); // 8% waste
  const cementFoundation=Math.ceil((perimeter*0.6*0.4)*c.cementPerM3); // strip foundation
  const cementSlab=Math.ceil(floorArea*c.cementPerSqmSlab);
  const cementWall=Math.ceil(blocks/80); // ~1 bag per 80 blocks for mortar
  const cementTotal=cementFoundation+cementSlab+cementWall;
  const rebarBars=Math.ceil(floorArea*c.rebarPerSqmSlab);
  const sand=Math.ceil((floorArea*0.1+wallArea*0.03)*1.6); // tons
  const gravel=Math.ceil(floorArea*0.1*1.8);

  const items=[];
  items.push({name:'Hollow Concrete Block 9"',qty:blocks,unit:"pieces",gmdUnit:42,cat:"Structural Materials"});
  items.push({name:"Portland Cement 50kg",qty:cementTotal,unit:"bags",gmdUnit:525,cat:"Structural Materials"});
  items.push({name:"Rebar Y12 \u00d7 6m",qty:rebarBars,unit:"bars",gmdUnit:680,cat:"Structural Materials"});
  items.push({name:"Sharp Sand",qty:sand,unit:"tons",gmdUnit:1400,cat:"Structural Materials"});
  items.push({name:"Gravel / Aggregate",qty:gravel,unit:"tons",gmdUnit:1650,cat:"Structural Materials"});
  items.push({name:"Laterite Fill",qty:Math.ceil(floorArea*0.2),unit:"tons",gmdUnit:950,cat:"Structural Materials"});
  items.push({name:"Binding Wire 1kg",qty:Math.ceil(rebarBars/20),unit:"rolls",gmdUnit:95,cat:"Structural Materials"});

  if(roofType==="iron"){
    items.push({name:"Long Span Sheet 0.55mm — 3m",qty:Math.ceil(roofArea*c.sheetsPerSqmRoof*1.1),unit:"sheets",gmdUnit:920,cat:"Roofing"});
    items.push({name:"Ridge Cap 3m",qty:Math.ceil(perimeter/4/3),unit:"pieces",gmdUnit:480,cat:"Roofing"});
    items.push({name:'Roofing Nails 3" (1kg)',qty:Math.ceil(roofArea*0.05),unit:"kg",gmdUnit:75,cat:"Roofing"});
    items.push({name:"Roof Timber Batten 2\u00d72",qty:Math.ceil(roofArea*0.8),unit:"pieces",gmdUnit:160,cat:"Roofing"});
  } else {
    items.push({name:"Roofing Screws with Washer",qty:Math.ceil(roofArea*0.6),unit:"packs",gmdUnit:220,cat:"Roofing"});
    items.push({name:"Long Span Sheet 0.55mm — 6m",qty:Math.ceil(roofArea*c.sheetsPerSqmRoof*0.6),unit:"sheets",gmdUnit:1750,cat:"Roofing"});
  }

  items.push({name:"Polythene DPC Membrane",qty:Math.ceil(floorArea/50)+1,unit:"rolls",gmdUnit:1100,cat:"Roofing"});
  items.push({name:"Shuttering Plywood 18mm",qty:Math.ceil(floorArea/3.2),unit:"sheets",gmdUnit:1850,cat:"Structural Materials"});
  items.push({name:"2\u00d74 Pine Timber 3m",qty:Math.ceil(floorArea*0.4),unit:"pieces",gmdUnit:285,cat:"Structural Materials"});

  return items;
}

}

function SavedProjects({currency}){
  const{items,clear}=useCart();
  const[projects,setProjects]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('briksafe_projects')||'[]');}
    catch{return [];}
  });
  const[newName,setNewName]=useState("");

  function save(){
    if(!newName.trim()||!items.length)return;
    const proj={
      id:Date.now().toString(),
      name:newName.trim(),
      items:[...items],
      saved:new Date().toLocaleDateString('en-GB'),
      currency,
    };
    const updated=[proj,...projects];
    setProjects(updated);
    localStorage.setItem('briksafe_projects',JSON.stringify(updated));
    setNewName("");
  }
  function del(id){
    const updated=projects.filter(p=>p.id!==id);
    setProjects(updated);
    localStorage.setItem('briksafe_projects',JSON.stringify(updated));
  }
  function load(proj){
    // Load items into cart context — we need to use the add function
    // We expose this via a custom event since we can't easily access CartCtx here
    window.dispatchEvent(new CustomEvent('briksafe:loadproject',{detail:proj.items}));
  }
  const projTotal=(proj)=>proj.items.reduce((s,i)=>s+i.gmd*(i.qty||1),0);

  return h('section',{id:"projects",className:"sec proj-sec"},
    h('div',{className:"wrap"},
      h('div',{className:"sec-eyebrow"},"My Projects"),
      h('h2',{className:"sec-title"},"Saved quote lists."),
      h('p',{className:"sec-sub"},"Save your current quote as a named project — plan by phase, compare options, or pick up where you left off. Saved locally in your browser."),
      h('div',{className:"proj-grid",style:{marginTop:"var(--sp-8)"}},
        h('div',{className:"proj-new"},
          h('div',{className:"proj-new-label"},"Save current quote as a project"),
          h('input',{
            className:"proj-new-input",
            type:"text",placeholder:'e.g. "Foundation Phase" or "Roofing"',
            value:newName,onChange:e=>setNewName(e.target.value),
            onKeyDown:e=>e.key==='Enter'&&save(),
          }),
          h('div',{style:{display:"flex",gap:"8px",alignItems:"center"}},
            h('button',{
              className:"proj-save-btn",
              onClick:save,
              disabled:!newName.trim()||!items.length,
            },"Save Project"),
            items.length===0&&h('span',{style:{fontSize:"var(--t-xs)",color:"var(--ink-400)"}},"Add items to your quote first")
          ),
          h('p',{style:{fontSize:"var(--t-xs)",color:"var(--ink-400)",marginTop:"6px",lineHeight:"1.5"}},
            "\u26a0\ufe0f Projects are saved in this browser only. Clearing your browser data or switching devices will remove them."
          )
        ),
        projects.length===0
          ? h('div',{className:"proj-empty"},"No saved projects yet. Build a quote and save it here to plan your build phase by phase.")
          : projects.map(proj=>h('div',{key:proj.id,className:"proj-card"},
              h('div',{className:"proj-card-name"},proj.name),
              h('div',{className:"proj-card-meta"},proj.items.length+" items \u00b7 saved "+proj.saved),
              h('div',{className:"proj-card-total"},fmt(projTotal(proj),proj.currency)),
              h('div',{className:"proj-card-actions"},
                h('button',{className:"proj-btn proj-btn-load",onClick:()=>load(proj)},"Load into Quote"),
                h('button',{className:"proj-btn proj-btn-del",onClick:()=>del(proj.id)},"Delete")
              )
            ))
      )
    )
  );
}
